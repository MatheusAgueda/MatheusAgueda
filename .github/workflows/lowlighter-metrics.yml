name: Lowlighter Metrics
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # === HEADER: Half-year calendar + isocalendar ===
      - name: Half-year calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_display: large
          config_output: svg

      # === LANGUAGES: Detailed breakdown ===
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 12
          plugin_languages_sections: most-used, recently-used
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          config_display: large
          config_output: svg

      # === ACTIVITY: Recent GitHub events timeline ===
      - name: Activity
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/activity.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14
          plugin_activity_filter: all
          config_display: large
          config_output: svg

      # === FOLLOW-UP: Issues & PRs tracking ===
      - name: Follow-up
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes
          config_display: large
          config_output: svg

      # === TOPICS: Repository topics word cloud ===
      - name: Topics
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/topics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_topics: yes
          plugin_topics_mode: mastered
          plugin_topics_sort: stars
          plugin_topics_limit: 0
          config_display: large
          config_output: svg

      # === LINES: Lines of code history ===
      - name: Lines
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: repositories
          plugin_lines: yes
          plugin_lines_sections: base, repositories, history
          plugin_lines_repositories_limit: 6
          plugin_lines_history_limit: 1
          config_output: svg

      # === FULL HEADER: Base stats ===
      - name: Base Stats
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: header, activity, community, repositories
          base_indepth: yes
          config_display: large
          config_output: svg

      # === NOTABLE CONTRIBUTIONS ===
      - name: Notable
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/notable.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes
          config_output: svg
