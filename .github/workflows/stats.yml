name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: GitHub Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatheusAgueda
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Lisbon
          config_order: base.header, base.activity+community, base.repositories

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages-full.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: MatheusAgueda
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 10
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size

      - name: Commit & Push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add metrics/
          git diff --staged --quiet || git commit -m "chore: update metrics stats" && git push
