<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <style>
    @keyframes dash1 { from { stroke-dashoffset: 188; } to { stroke-dashoffset: 11; } }
    @keyframes dash2 { from { stroke-dashoffset: 188; } to { stroke-dashoffset: 75; } }
    @keyframes dash3 { from { stroke-dashoffset: 188; } to { stroke-dashoffset: 11; } }
    @keyframes blink { 0%,49%,100% { opacity: 1; } 50%,99% { opacity: 0.15; } }
    @keyframes shimmer { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes pulse { 0%,100% { opacity: 0.3; } 50% { opacity: 0.9; } }
    @keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }
    .bg { fill: #06060e; }
    .grid { stroke: #121222; stroke-width: 0.5; }
    .panel { fill: #0a0a14; stroke: #1a1a2e; stroke-width: 1; rx: 4; }
    .txt { font-family: 'Courier New', monospace; }
    .t-b { font-size: 10px; font-weight: bold; fill: #e0e0ff; letter-spacing: 0.5px; }
    .t-d { font-size: 8px; fill: #52527a; }
    .t-a { font-size: 9px; fill: #00D4FF; }
    .bl { animation: blink 1.4s infinite; }
    .sh { animation: shimmer 3s ease-in-out infinite; }
    .pu { animation: pulse 4s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="sg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="gl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="350" class="bg"/>

  <!-- Grid -->
  <g class="grid">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="350"/><line x1="300" y1="0" x2="300" y2="350"/>
    <line x1="450" y1="0" x2="450" y2="350"/><line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="750" y1="0" x2="750" y2="350"/>
  </g>

  <!-- Header bar -->
  <rect x="0" y="0" width="900" height="25" fill="#0a0a14"/>
  <rect x="0" y="23" width="900" height="2" fill="url(#hg)" class="sh"/>
  <text x="15" y="16" class="txt t-b" fill="#00D4FF" letter-spacing="1">SYS.MON // OMEGA-V4.2</text>
  <text x="780" y="16" class="txt t-d" letter-spacing="0.5">NODE: EU-WEST-1</text>
  <circle cx="770" cy="12" r="3" fill="#00FF66" class="bl"/>

  <!-- ========== PANEL 1: STATUS ROWS (Left) ========== -->
  <rect x="10" y="35" width="280" height="305" class="panel"/>
  <text x="22" y="55" class="txt t-b" letter-spacing="0.5">SYSTEM SUBSYSTEMS</text>
  <line x1="22" y1="63" x2="278" y2="63" stroke="#1a1a2e"/>

  <!-- Row 1: Fleet Brain -->
  <circle cx="26" cy="80" r="2.5" fill="#00FF66" class="bl"/>
  <text x="37" y="83" class="txt t-d">Fleet Brain</text>
  <text x="267" y="83" class="txt" font-size="9" fill="#e0e0ff" text-anchor="end">228 models</text>
  <!-- Row 2 -->
  <circle cx="26" cy="117" r="2.5" fill="#00FF66" class="bl" style="animation-delay:-.2s"/>
  <text x="37" y="120" class="txt t-d">Lead Scraper</text>
  <text x="267" y="120" class="txt" font-size="9" fill="#00D4FF" text-anchor="end">1.93M</text>
  <!-- Row 3 -->
  <circle cx="26" cy="154" r="2.5" fill="#00FF66" class="bl" style="animation-delay:-.4s"/>
  <text x="37" y="157" class="txt t-d">Email Engine</text>
  <text x="267" y="157" class="txt" font-size="9" fill="#BD00FF" text-anchor="end">385/day</text>
  <!-- Row 4 -->
  <circle cx="26" cy="191" r="2.5" fill="#00FF66" class="bl" style="animation-delay:-.6s"/>
  <text x="37" y="194" class="txt t-d">Claude Harness</text>
  <text x="267" y="194" class="txt" font-size="9" fill="#e0e0ff" text-anchor="end">17 agents</text>
  <!-- Row 5 -->
  <circle cx="26" cy="228" r="2.5" fill="#00FF66" class="bl" style="animation-delay:-.8s"/>
  <text x="37" y="231" class="txt t-d">Jarvis CU</text>
  <text x="267" y="231" class="txt" font-size="9" fill="#e0e0ff" text-anchor="end">4 lanes</text>
  <!-- Row 6 -->
  <circle cx="26" cy="265" r="2.5" fill="#00FF66" class="bl" style="animation-delay:-1s"/>
  <text x="37" y="268" class="txt t-d">MHL Platform</text>
  <text x="267" y="268" class="txt" font-size="9" fill="#FF2D95" text-anchor="end">Next.js 15</text>
  <!-- Row 7 -->
  <circle cx="26" cy="302" r="2.5" fill="#00FF66" class="bl" style="animation-delay:-1.2s"/>
  <text x="37" y="305" class="txt t-d">Trading Jessie</text>
  <text x="267" y="305" class="txt" font-size="9" fill="#00FF66" text-anchor="end">+Moon active</text>

  <!-- ========== PANEL 2: GAUGES + BARS (Middle) ========== -->
  <rect x="300" y="35" width="290" height="305" class="panel"/>
  <text x="312" y="55" class="txt t-b" letter-spacing="0.5">PERFORMANCE METRICS</text>
  <line x1="312" y1="63" x2="578" y2="63" stroke="#1a1a2e"/>

  <!-- Gauge 1: 1.93M -->
  <circle cx="360" cy="110" r="28" fill="none" stroke="#1a1a2e" stroke-width="4"/>
  <circle cx="360" cy="110" r="28" fill="none" stroke="#FF2D95" stroke-width="4" stroke-dasharray="176" stroke-linecap="round" filter="url(#gl)" stroke-dashoffset="176">
    <animate attributeName="stroke-dashoffset" from="176" to="9" dur="2s" fill="freeze"/>
  </circle>
  <text x="360" y="113" class="txt" font-size="8" font-weight="bold" fill="#e0e0ff" text-anchor="middle">1.93M</text>
  <text x="360" y="148" class="txt t-d" text-anchor="middle">THROUGHPUT</text>

  <!-- Gauge 2: 385/d -->
  <circle cx="445" cy="110" r="28" fill="none" stroke="#1a1a2e" stroke-width="4"/>
  <circle cx="445" cy="110" r="28" fill="none" stroke="#00D4FF" stroke-width="4" stroke-dasharray="176" stroke-linecap="round" filter="url(#gl)" stroke-dashoffset="176">
    <animate attributeName="stroke-dashoffset" from="176" to="60" dur="2.2s" fill="freeze"/>
  </circle>
  <text x="445" y="113" class="txt" font-size="8" font-weight="bold" fill="#e0e0ff" text-anchor="middle">385/d</text>
  <text x="445" y="148" class="txt t-d" text-anchor="middle">VELOCITY</text>

  <!-- Gauge 3: 94.2% -->
  <circle cx="530" cy="110" r="28" fill="none" stroke="#1a1a2e" stroke-width="4"/>
  <circle cx="530" cy="110" r="28" fill="none" stroke="#BD00FF" stroke-width="4" stroke-dasharray="176" stroke-linecap="round" filter="url(#gl)" stroke-dashoffset="176">
    <animate attributeName="stroke-dashoffset" from="176" to="10" dur="2.4s" fill="freeze"/>
  </circle>
  <text x="530" y="113" class="txt" font-size="8" font-weight="bold" fill="#e0e0ff" text-anchor="middle">94.2%</text>
  <text x="530" y="148" class="txt t-d" text-anchor="middle">EFFICIENCY</text>

  <!-- Progress Bars -->
  <line x1="320" y1="170" x2="570" y2="170" stroke="#1a1a2e"/>
  <!-- Node.js 95% -->
  <text x="320" y="185" class="txt t-d">Node.js Core</text>
  <text x="570" y="185" class="txt" font-size="9" fill="#00D4FF" text-anchor="end">95%</text>
  <rect x="320" y="190" width="250" height="4" fill="#1a1a2e" rx="2"/>
  <rect x="320" y="190" width="0" height="4" fill="#00D4FF" rx="2" filter="url(#gl)">
    <animate attributeName="width" from="0" to="237" dur="1.5s" fill="freeze"/>
  </rect>
  <!-- Python 92% -->
  <text x="320" y="215" class="txt t-d">Python Pipeline</text>
  <text x="570" y="215" class="txt" font-size="9" fill="#BD00FF" text-anchor="end">92%</text>
  <rect x="320" y="220" width="250" height="4" fill="#1a1a2e" rx="2"/>
  <rect x="320" y="220" width="0" height="4" fill="#BD00FF" rx="2" filter="url(#gl)">
    <animate attributeName="width" from="0" to="230" dur="1.7s" fill="freeze"/>
  </rect>
  <!-- PostgreSQL 88% -->
  <text x="320" y="245" class="txt t-d">PostgreSQL Cluster</text>
  <text x="570" y="245" class="txt" font-size="9" fill="#FF2D95" text-anchor="end">88%</text>
  <rect x="320" y="250" width="250" height="4" fill="#1a1a2e" rx="2"/>
  <rect x="320" y="250" width="0" height="4" fill="#FF2D95" rx="2" filter="url(#gl)">
    <animate attributeName="width" from="0" to="220" dur="1.9s" fill="freeze"/>
  </rect>
  <!-- AI Engineering 90% -->
  <text x="320" y="275" class="txt t-d">AI Engineering</text>
  <text x="570" y="275" class="txt" font-size="9" fill="#00FF66" text-anchor="end">90%</text>
  <rect x="320" y="280" width="250" height="4" fill="#1a1a2e" rx="2"/>
  <rect x="320" y="280" width="0" height="4" fill="#00FF66" rx="2" filter="url(#gl)">
    <animate attributeName="width" from="0" to="225" dur="2.1s" fill="freeze"/>
  </rect>

  <!-- ========== PANEL 3: SPARKLINE + TELEMETRY (Right) ========== -->
  <rect x="600" y="35" width="290" height="305" class="panel"/>
  <text x="612" y="55" class="txt t-b" letter-spacing="0.5">NEURAL TELEMETRY</text>
  <line x1="612" y1="63" x2="878" y2="63" stroke="#1a1a2e"/>

  <!-- Sparkline area -->
  <g>
    <line x1="615" y1="80" x2="875" y2="80" class="grid"/><line x1="615" y1="115" x2="875" y2="115" class="grid"/>
    <line x1="615" y1="150" x2="875" y2="150" class="grid"/><line x1="615" y1="185" x2="875" y2="185" class="grid"/>
    <!-- Area fill -->
    <polygon points="615,185 615,140 650,155 685,120 720,135 755,100 790,125 825,95 860,110 875,90 875,185" fill="url(#sg)"/>
    <!-- Line -->
    <polyline points="615,140 650,155 685,120 720,135 755,100 790,125 825,95 860,110 875,90" fill="none" stroke="#00D4FF" stroke-width="2" filter="url(#gl)" stroke-dasharray="400" stroke-dashoffset="400">
      <animate attributeName="stroke-dashoffset" from="400" to="0" dur="2.5s" fill="freeze"/>
    </polyline>
    <!-- Peak dots -->
    <circle cx="755" cy="100" r="3" fill="#00D4FF" class="bl"/>
    <circle cx="825" cy="95" r="3" fill="#00D4FF" class="bl" style="animation-delay:-.3s"/>
    <circle cx="875" cy="90" r="3" fill="#FF2D95" class="bl" style="animation-delay:-.6s"/>
    <text x="615" y="200" class="txt t-d">BANDWIDTH LOAD (24H)</text>
    <text x="875" y="200" class="txt" font-size="9" fill="#00D4FF" text-anchor="end">PEAK 98.4%</text>
  </g>

  <!-- Radar box -->
  <rect x="615" y="215" width="260" height="110" fill="#06060e" stroke="#1a1a2e" rx="3"/>
  <!-- Radar circles -->
  <circle cx="660" cy="270" r="30" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <circle cx="660" cy="270" r="20" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <circle cx="660" cy="270" r="10" fill="none" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="630" y1="270" x2="690" y2="270" stroke="#1a1a2e" stroke-width="0.5"/>
  <line x1="660" y1="240" x2="660" y2="300" stroke="#1a1a2e" stroke-width="0.5"/>
  <!-- Sweep line (SMIL) -->
  <line x1="660" y1="270" x2="681" y2="249" stroke="#00D4FF" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" from="0 660 270" to="360 660 270" dur="4s" repeatCount="indefinite"/>
  </line>
  <circle cx="672" cy="258" r="2" fill="#FF2D95" class="bl"/>
  <!-- Info text -->
  <text x="705" y="245" class="txt t-b">AUTONOMOUS MESH</text>
  <text x="705" y="260" class="txt t-d">Status: Optimal / Synced</text>
  <text x="705" y="275" class="txt t-d">Latency: 12ms (Global)</text>
  <text x="705" y="290" class="txt" font-size="8" fill="#00FF66">SECURE ENCRYPTION ACTIVE</text>

  <!-- Floating particles -->
  <circle cx="250" cy="80" r="1" fill="#00D4FF" opacity="0.6" class="pu"/>
  <circle cx="550" cy="180" r="1.5" fill="#FF2D95" opacity="0.4" class="pu" style="animation-delay:-1s"/>
  <circle cx="720" cy="60" r="1" fill="#BD00FF" opacity="0.7" class="pu" style="animation-delay:-2s"/>
  <circle cx="120" cy="280" r="1.5" fill="#00FF66" opacity="0.5" class="pu" style="animation-delay:-3s"/>
  <circle cx="400" cy="320" r="1" fill="#00D4FF" opacity="0.5" class="pu" style="animation-delay:-1.5s"/>
  <circle cx="800" cy="150" r="1" fill="#FF2D95" opacity="0.4" class="pu" style="animation-delay:-2.5s"/>

  <!-- Scanline -->
  <rect x="0" y="0" width="900" height="3" fill="#00D4FF" opacity="0">
    <animate attributeName="y" from="-3" to="350" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.1;0.1;0" keyTimes="0;0.05;0.95;1" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
