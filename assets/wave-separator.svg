<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%" height="60" preserveAspectRatio="none">
  <defs>

    <!-- Gradient: pink → purple → cyan -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF2D95" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#BD00FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="1"/>
    </linearGradient>

    <!-- Gradient: cyan → purple → pink (reverse) -->
    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#BD00FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF2D95" stop-opacity="1"/>
    </linearGradient>

    <!-- Gradient: pink → cyan (sharp) -->
    <linearGradient id="waveGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FF2D95" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Gradient: purple → pink -->
    <linearGradient id="waveGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#BD00FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF2D95" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Glow filter: pink -->
    <filter id="glowPink" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#FF2D95" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter: cyan -->
    <filter id="glowCyan" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#00D4FF" flood-opacity="0.7" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter: purple -->
    <filter id="glowPurple" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#BD00FF" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft outer glow for primary wave -->
    <filter id="glowSoft" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Wave paths for SMIL particle motion -->
    <!-- Wave A (primary, used by particles 1-3) -->
    <path id="particlePath1"
      d="M-1200,30 C-1050,10 -900,50 -750,30 C-600,10 -450,50 -300,30 C-150,10 0,50 150,30 C300,10 450,50 600,30 C750,10 900,50 1050,30 C1200,10 1350,50 1500,30 C1650,10 1800,50 1950,30 C2100,10 2250,50 2400,30"
      fill="none"/>

    <!-- Wave B (phase offset, used by particles 4-5) -->
    <path id="particlePath2"
      d="M-1200,35 C-1080,15 -960,55 -840,35 C-720,15 -600,55 -480,35 C-360,15 -240,55 -120,35 C0,15 120,55 240,35 C360,15 480,55 600,35 C720,15 840,55 960,35 C1080,15 1200,55 1320,35 C1440,15 1560,55 1680,35"
      fill="none"/>

    <!-- Wave C (high freq, used by particle 6) -->
    <path id="particlePath3"
      d="M-1200,30 C-1100,18 -1000,42 -900,30 C-800,18 -700,42 -600,30 C-500,18 -400,42 -300,30 C-200,18 -100,42 0,30 C100,18 200,42 300,30 C400,18 500,42 600,30 C700,18 800,42 900,30 C1000,18 1100,42 1200,30 C1300,18 1400,42 1500,30 C1600,18 1700,42 1800,30"
      fill="none"/>

  </defs>

  <style>
    /* Wave layer 1 — primary, slowest */
    @keyframes wave1 {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(-600px); }
    }
    /* Wave layer 2 — medium speed, offset phase */
    @keyframes wave2 {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(-480px); }
    }
    /* Wave layer 3 — fast, high freq */
    @keyframes wave3 {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(-400px); }
    }
    /* Wave layer 4 — slowest, deep background */
    @keyframes wave4 {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(-800px); }
    }
    /* Glow pulse for primary wave */
    @keyframes glowPulse {
      0%, 100% { opacity: 0.9; filter: url(#glowSoft); }
      50%       { opacity: 1;   filter: url(#glowPink); }
    }
    /* Cyan wave shimmer */
    @keyframes cyanShimmer {
      0%, 100% { opacity: 0.55; }
      50%       { opacity: 0.85; }
    }
    /* Purple wave breathe */
    @keyframes purpleBreathe {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 0.65; }
    }
    /* Particle fade in/out */
    @keyframes particleFade {
      0%, 100% { opacity: 0;   }
      20%, 80% { opacity: 1;   }
    }
    /* Particle twinkle */
    @keyframes particleTwinkle {
      0%, 100% { r: 1.5; opacity: 0.6; }
      50%       { r: 2.5; opacity: 1;   }
    }

    .wave1 { animation: wave1 6s linear infinite; }
    .wave2 { animation: wave2 4.2s linear infinite; }
    .wave3 { animation: wave3 3s linear infinite; }
    .wave4 { animation: wave4 9s linear infinite; }
    .glow-pulse  { animation: glowPulse 3s ease-in-out infinite; }
    .cyan-shimmer { animation: cyanShimmer 2.5s ease-in-out infinite; }
    .purple-breathe { animation: purpleBreathe 4s ease-in-out infinite; }
    .particle-fade { animation: particleFade 4s ease-in-out infinite; }
    .particle-twinkle { animation: particleTwinkle 2s ease-in-out infinite; }
  </style>

  <!-- ─── LAYER 4: Deep background wave (slowest, lowest opacity) ───────── -->
  <g class="wave4" style="opacity:0.22;">
    <!-- Two tiles wide to allow seamless loop -->
    <path
      d="M0,30 C100,8 200,52 300,30 C400,8 500,52 600,30 C700,8 800,52 900,30 C1000,8 1100,52 1200,30 C1300,8 1400,52 1500,30 C1600,8 1700,52 1800,30"
      fill="none" stroke="url(#waveGrad4)" stroke-width="1.5"/>
  </g>

  <!-- ─── LAYER 3: Cyan fast wave ───────────────────────────────────────── -->
  <g class="wave3 cyan-shimmer">
    <path
      d="M0,28 C75,14 150,46 225,28 C300,14 375,46 450,28 C525,14 600,46 675,28 C750,14 825,46 900,28 C975,14 1050,46 1125,28 C1200,14 1275,46 1350,28 C1425,14 1500,46 1575,28 C1650,14 1725,46 1800,28"
      fill="none" stroke="url(#waveGrad2)" stroke-width="1.2"
      filter="url(#glowCyan)"/>
  </g>

  <!-- ─── LAYER 2: Purple mid-wave ─────────────────────────────────────── -->
  <g class="wave2 purple-breathe">
    <path
      d="M0,32 C120,12 240,52 360,32 C480,12 600,52 720,32 C840,12 960,52 1080,32 C1200,12 1320,52 1440,32 C1560,12 1680,52 1800,32"
      fill="none" stroke="url(#waveGrad4)" stroke-width="2"
      filter="url(#glowPurple)"/>
  </g>

  <!-- ─── LAYER 1: Primary neon wave (hero) ────────────────────────────── -->
  <g class="wave1 glow-pulse">
    <!-- Shadow/halo pass (thicker, more blur) -->
    <path
      d="M0,30 C150,8 300,52 450,30 C600,8 750,52 900,30 C1050,8 1200,52 1350,30 C1500,8 1650,52 1800,30"
      fill="none" stroke="url(#waveGrad1)" stroke-width="6" stroke-opacity="0.2"
      filter="url(#glowSoft)"/>
    <!-- Crisp top pass -->
    <path
      d="M0,30 C150,8 300,52 450,30 C600,8 750,52 900,30 C1050,8 1200,52 1350,30 C1500,8 1650,52 1800,30"
      fill="none" stroke="url(#waveGrad1)" stroke-width="1.8"
      filter="url(#glowPink)"/>
  </g>

  <!-- ─── PARTICLES — SMIL animateMotion ───────────────────────────────── -->

  <!-- Particle 1: pink dot, primary wave path -->
  <circle r="2" fill="#FF2D95" class="particle-fade">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath1"/>
    </animateMotion>
  </circle>

  <!-- Particle 2: cyan dot, primary wave path, offset begin -->
  <circle r="1.8" fill="#00D4FF" class="particle-twinkle">
    <animateMotion dur="8s" begin="2.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath1"/>
    </animateMotion>
  </circle>

  <!-- Particle 3: purple dot, primary wave, late start -->
  <circle r="2" fill="#BD00FF" class="particle-fade" style="animation-delay:1.5s;">
    <animateMotion dur="8s" begin="5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath1"/>
    </animateMotion>
  </circle>

  <!-- Particle 4: small cyan, phase-B wave -->
  <circle r="1.5" fill="#00D4FF" class="particle-fade" style="animation-delay:0.8s;">
    <animateMotion dur="6s" begin="1s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath2"/>
    </animateMotion>
  </circle>

  <!-- Particle 5: pink dot, phase-B wave, different timing -->
  <circle r="2.2" fill="#FF2D95" class="particle-twinkle" style="animation-delay:1.2s;">
    <animateMotion dur="6s" begin="3.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath2"/>
    </animateMotion>
  </circle>

  <!-- Particle 6: white-ish (mix of all) high-freq wave -->
  <circle r="1.4" fill="#E8AAFF" class="particle-fade" style="animation-delay:0.3s;">
    <animateMotion dur="4.5s" begin="0.5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath3"/>
    </animateMotion>
  </circle>

  <!-- Particle 7: trailing pink, high-freq wave -->
  <circle r="1.2" fill="#FF2D95" class="particle-twinkle" style="animation-delay:2s;">
    <animateMotion dur="4.5s" begin="2.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath3"/>
    </animateMotion>
  </circle>

  <!-- Particle 8: trailing cyan, high-freq wave, offset -->
  <circle r="1.6" fill="#00D4FF" class="particle-fade" style="animation-delay:1.1s;">
    <animateMotion dur="4.5s" begin="4s" repeatCount="indefinite" rotate="auto">
      <mpath href="#particlePath3"/>
    </animateMotion>
  </circle>

</svg>
