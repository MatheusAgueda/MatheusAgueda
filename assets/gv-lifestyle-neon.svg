<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <style>
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 0.9; } }
    @keyframes warmglow { 0%,100% { opacity: 0.1; } 50% { opacity: 0.3; } }
    @keyframes flicker { 0% { opacity: 0.3; } 20% { opacity: 0.85; } 40% { opacity: 0.45; } 60% { opacity: 0.95; } 80% { opacity: 0.55; } 100% { opacity: 0.3; } }
    @keyframes star { 0%,100% { opacity: 0.1; } 50% { opacity: 0.75; } }
    @keyframes water { 0%,100% { opacity: 0.15; } 50% { opacity: 0.4; } }
    @keyframes sway { 0%,100% { opacity: 0.3; } 50% { opacity: 0.6; } }
    .pu { animation: pulse 3s ease-in-out infinite; }
    .wg { animation: warmglow 3s ease-in-out infinite; }
    .fl { animation: flicker 2s ease-in-out infinite; }
    .st { animation: star 4s ease-in-out infinite; }
    .wa { animation: water 5s ease-in-out infinite; }
    .sw { animation: sway 6s ease-in-out infinite; }
    .txt { font-family: 'Courier New', monospace; }
  </style>
  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="350" fill="#06060e"/>

  <!-- Stars -->
  <circle cx="70" cy="20" r="1" fill="#fff" class="st"/>
  <circle cx="200" cy="40" r="1.2" fill="#00D4FF" class="st" style="animation-delay:-1s"/>
  <circle cx="330" cy="15" r="0.8" fill="#fff" class="st" style="animation-delay:-2s"/>
  <circle cx="500" cy="30" r="1" fill="#BD00FF" class="st" style="animation-delay:-.5s"/>
  <circle cx="650" cy="18" r="0.9" fill="#fff" class="st" style="animation-delay:-3s"/>
  <circle cx="780" cy="35" r="1.1" fill="#FF2D95" class="st" style="animation-delay:-1.5s"/>
  <circle cx="870" cy="22" r="0.7" fill="#fff" class="st" style="animation-delay:-2.5s"/>
  <circle cx="420" cy="45" r="0.6" fill="#00D4FF" class="st" style="animation-delay:-.8s"/>

  <!-- Sunset glow (horizon) -->
  <ellipse cx="450" cy="145" rx="400" ry="30" fill="#FF2D95" opacity="0.03"/>

  <!-- ===== STATIC CARAVAN (center-left, proper wide bungalow) ===== -->
  <g filter="url(#glow)">
    <!-- Foundation blocks -->
    <rect x="92" y="195" width="14" height="8" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.25"/>
    <rect x="200" y="195" width="14" height="8" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.25"/>
    <rect x="310" y="195" width="14" height="8" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.25"/>
    <rect x="400" y="195" width="14" height="8" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.25"/>
    <!-- Main body: wide, low -->
    <rect x="80" y="115" width="340" height="80" fill="none" stroke="#00D4FF" stroke-width="1.8" rx="2"/>
    <!-- Horizontal cladding -->
    <line x1="80" y1="128" x2="420" y2="128" stroke="#00D4FF" stroke-width="0.25" opacity="0.12"/>
    <line x1="80" y1="141" x2="420" y2="141" stroke="#00D4FF" stroke-width="0.25" opacity="0.12"/>
    <line x1="80" y1="154" x2="420" y2="154" stroke="#00D4FF" stroke-width="0.25" opacity="0.12"/>
    <line x1="80" y1="167" x2="420" y2="167" stroke="#00D4FF" stroke-width="0.25" opacity="0.12"/>
    <line x1="80" y1="180" x2="420" y2="180" stroke="#00D4FF" stroke-width="0.25" opacity="0.12"/>
    <!-- Low-pitch gable roof -->
    <polygon points="70,115 250,78 430,115" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    <line x1="250" y1="78" x2="250" y2="115" stroke="#00D4FF" stroke-width="0.4" opacity="0.15"/>
    <!-- Wide panoramic windows (wider than tall) -->
    <rect x="100" y="127" width="70" height="38" fill="none" stroke="#FF2D95" stroke-width="1.2" rx="1"/>
    <rect x="104" y="131" width="62" height="30" fill="#fbbf24" opacity="0.1" class="wg"/>
    <line x1="135" y1="127" x2="135" y2="165" stroke="#FF2D95" stroke-width="0.6" opacity="0.4"/>
    <!-- Person silhouette inside window 1 -->
    <circle cx="120" cy="148" r="4.5" fill="none" stroke="#FF2D95" stroke-width="0.6" opacity="0.3"/>
    <line x1="120" y1="153" x2="120" y2="163" stroke="#FF2D95" stroke-width="0.6" opacity="0.25"/>

    <rect x="190" y="127" width="55" height="35" fill="none" stroke="#FF2D95" stroke-width="1.2" rx="1"/>
    <rect x="194" y="131" width="47" height="27" fill="#fbbf24" opacity="0.1" class="wg" style="animation-delay:-.7s"/>
    <line x1="218" y1="127" x2="218" y2="162" stroke="#FF2D95" stroke-width="0.5" opacity="0.35"/>

    <rect x="310" y="127" width="60" height="38" fill="none" stroke="#FF2D95" stroke-width="1.2" rx="1"/>
    <rect x="314" y="131" width="52" height="30" fill="#fbbf24" opacity="0.1" class="wg" style="animation-delay:-1.4s"/>
    <line x1="340" y1="127" x2="340" y2="165" stroke="#FF2D95" stroke-width="0.6" opacity="0.4"/>
    <!-- Person silhouette inside window 3 -->
    <circle cx="350" cy="146" r="4.5" fill="none" stroke="#FF2D95" stroke-width="0.6" opacity="0.3"/>
    <line x1="350" y1="151" x2="350" y2="161" stroke="#FF2D95" stroke-width="0.6" opacity="0.25"/>
    <line x1="350" y1="155" x2="344" y2="159" stroke="#FF2D95" stroke-width="0.5" opacity="0.2"/>
    <line x1="350" y1="155" x2="356" y2="159" stroke="#FF2D95" stroke-width="0.5" opacity="0.2"/>

    <!-- Door with glass panel -->
    <rect x="262" y="145" width="30" height="50" fill="none" stroke="#00D4FF" stroke-width="1.2" rx="1"/>
    <rect x="267" y="150" width="20" height="18" fill="none" stroke="#00D4FF" stroke-width="0.5" opacity="0.4"/>
    <circle cx="286" cy="172" r="2" fill="#BD00FF" opacity="0.5"/>
  </g>

  <!-- ===== WOODEN DECK ===== -->
  <g filter="url(#glow)">
    <rect x="430" y="175" width="200" height="22" fill="none" stroke="#BD00FF" stroke-width="1.2" opacity="0.7"/>
    <!-- Planks -->
    <line x1="450" y1="175" x2="450" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="470" y1="175" x2="470" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="490" y1="175" x2="490" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="510" y1="175" x2="510" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="530" y1="175" x2="530" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="550" y1="175" x2="550" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="570" y1="175" x2="570" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="590" y1="175" x2="590" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <line x1="610" y1="175" x2="610" y2="197" stroke="#BD00FF" stroke-width="0.4" opacity="0.3"/>
    <!-- Railing -->
    <line x1="435" y1="150" x2="435" y2="175" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
    <line x1="530" y1="150" x2="530" y2="175" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
    <line x1="625" y1="150" x2="625" y2="175" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
    <line x1="435" y1="155" x2="625" y2="155" stroke="#BD00FF" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- ===== COUPLE ON DECK ===== -->
  <g filter="url(#glow-sm)">
    <!-- Person 1 (standing, looking out) -->
    <circle cx="480" cy="143" r="6" fill="none" stroke="#FF2D95" stroke-width="1" opacity="0.6"/>
    <line x1="480" y1="149" x2="480" y2="172" stroke="#FF2D95" stroke-width="1" opacity="0.5"/>
    <line x1="480" y1="172" x2="475" y2="185" stroke="#FF2D95" stroke-width="0.8" opacity="0.4"/>
    <line x1="480" y1="172" x2="485" y2="185" stroke="#FF2D95" stroke-width="0.8" opacity="0.4"/>
    <line x1="480" y1="155" x2="472" y2="162" stroke="#FF2D95" stroke-width="0.8" opacity="0.4"/>
    <line x1="480" y1="155" x2="488" y2="160" stroke="#FF2D95" stroke-width="0.8" opacity="0.4"/>

    <!-- Person 2 (sitting on chair) -->
    <circle cx="560" cy="148" r="5.5" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.6"/>
    <line x1="560" y1="154" x2="560" y2="170" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
    <line x1="560" y1="170" x2="555" y2="178" stroke="#00D4FF" stroke-width="0.8" opacity="0.4"/>
    <line x1="560" y1="170" x2="565" y2="178" stroke="#00D4FF" stroke-width="0.8" opacity="0.4"/>
    <!-- Chair -->
    <rect x="552" y="165" width="16" height="12" fill="none" stroke="#BD00FF" stroke-width="0.6" opacity="0.35"/>
  </g>

  <!-- ===== TABLE WITH DRINKS ===== -->
  <rect x="508" y="162" width="28" height="15" fill="none" stroke="#BD00FF" stroke-width="0.7" opacity="0.4"/>
  <!-- Glass 1 -->
  <rect x="514" y="158" width="4" height="6" fill="none" stroke="#FF2D95" stroke-width="0.4" opacity="0.4"/>
  <!-- Glass 2 -->
  <rect x="526" y="158" width="4" height="6" fill="none" stroke="#00D4FF" stroke-width="0.4" opacity="0.4"/>

  <!-- ===== FAIRY LIGHTS on deck ===== -->
  <path d="M435 148 Q460 140 480 146 Q500 152 520 144 Q540 136 560 142 Q580 148 600 140 Q620 132 625 148" fill="none" stroke="#fbbf24" stroke-width="0.3" opacity="0.2"/>
  <circle cx="445" cy="147" r="1.5" fill="#fbbf24" class="fl" filter="url(#glow-sm)"/>
  <circle cx="460" cy="142" r="1.2" fill="#FF2D95" class="fl" style="animation-delay:-.3s" filter="url(#glow-sm)"/>
  <circle cx="475" cy="145" r="1.5" fill="#fbbf24" class="fl" style="animation-delay:-.6s" filter="url(#glow-sm)"/>
  <circle cx="490" cy="150" r="1.2" fill="#00D4FF" class="fl" style="animation-delay:-.9s" filter="url(#glow-sm)"/>
  <circle cx="505" cy="147" r="1.5" fill="#fbbf24" class="fl" style="animation-delay:-1.2s" filter="url(#glow-sm)"/>
  <circle cx="520" cy="143" r="1.2" fill="#FF2D95" class="fl" style="animation-delay:-1.5s" filter="url(#glow-sm)"/>
  <circle cx="535" cy="140" r="1.5" fill="#fbbf24" class="fl" style="animation-delay:-.2s" filter="url(#glow-sm)"/>
  <circle cx="550" cy="140" r="1.2" fill="#00D4FF" class="fl" style="animation-delay:-.7s" filter="url(#glow-sm)"/>
  <circle cx="565" cy="143" r="1.5" fill="#fbbf24" class="fl" style="animation-delay:-1s" filter="url(#glow-sm)"/>
  <circle cx="580" cy="146" r="1.2" fill="#FF2D95" class="fl" style="animation-delay:-1.4s" filter="url(#glow-sm)"/>
  <circle cx="595" cy="143" r="1.5" fill="#fbbf24" class="fl" style="animation-delay:-.4s" filter="url(#glow-sm)"/>
  <circle cx="610" cy="138" r="1.2" fill="#00D4FF" class="fl" style="animation-delay:-1.8s" filter="url(#glow-sm)"/>
  <circle cx="620" cy="140" r="1.5" fill="#fbbf24" class="fl" style="animation-delay:-.1s" filter="url(#glow-sm)"/>

  <!-- ===== NATURE (trees right side) ===== -->
  <g filter="url(#glow-sm)">
    <!-- Pine 1 -->
    <line x1="720" y1="155" x2="720" y2="200" stroke="#00ff41" stroke-width="1.2" opacity="0.6"/>
    <polygon points="720,120 705,165 735,165" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.45"/>
    <polygon points="720,130 708,158 732,158" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.3"/>
    <!-- Pine 2 (taller) -->
    <line x1="760" y1="140" x2="760" y2="200" stroke="#00ff41" stroke-width="1.5" opacity="0.7"/>
    <polygon points="760,100 742,155 778,155" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
    <polygon points="760,115 745,148 775,148" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.35"/>
    <!-- Pine 3 -->
    <line x1="800" y1="150" x2="800" y2="200" stroke="#00ff41" stroke-width="1.2" opacity="0.55"/>
    <polygon points="800,115 787,158 813,158" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.4"/>
    <!-- Round tree -->
    <line x1="845" y1="160" x2="845" y2="200" stroke="#00ff41" stroke-width="1" opacity="0.5"/>
    <circle cx="845" cy="145" r="18" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.35"/>
    <circle cx="845" cy="145" r="10" fill="none" stroke="#00ff41" stroke-width="0.6" opacity="0.2"/>
  </g>

  <!-- ===== GROUND ===== -->
  <line x1="0" y1="200" x2="900" y2="200" stroke="#22c55e" stroke-width="1" opacity="0.35"/>

  <!-- ===== GARDEN / FLOWERS ===== -->
  <g filter="url(#glow-sm)">
    <circle cx="660" cy="195" r="3" fill="none" stroke="#FF2D95" stroke-width="0.8" opacity="0.4" class="sw"/>
    <line x1="660" y1="198" x2="660" y2="208" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
    <circle cx="675" cy="193" r="2.5" fill="none" stroke="#BD00FF" stroke-width="0.8" opacity="0.35" class="sw" style="animation-delay:-1s"/>
    <line x1="675" y1="196" x2="675" y2="206" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
    <circle cx="690" cy="196" r="3" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.4" class="sw" style="animation-delay:-2s"/>
    <line x1="690" y1="199" x2="690" y2="208" stroke="#00ff41" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- ===== FIRE PIT (foreground) ===== -->
  <g filter="url(#glow)">
    <circle cx="300" cy="240" r="14" fill="none" stroke="#FF2D95" stroke-width="1" opacity="0.5"/>
    <circle cx="300" cy="240" r="8" fill="#ff6b35" opacity="0.1" class="fl"/>
    <circle cx="300" cy="238" r="5" fill="#fbbf24" opacity="0.15" class="fl" style="animation-delay:-.3s"/>
    <circle cx="298" cy="235" r="3" fill="#ff4500" opacity="0.2" class="fl" style="animation-delay:-.6s"/>
    <!-- Sparks floating up -->
    <circle cx="297" cy="230" r="0.8" fill="#fbbf24" opacity="0">
      <animate attributeName="cy" from="230" to="205" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" keyTimes="0;0.3;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="303" cy="232" r="0.6" fill="#ff6b35" opacity="0">
      <animate attributeName="cy" from="232" to="210" dur="2.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0;0.5;0" keyTimes="0;0.3;1" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <!-- ===== BBQ GRILL ===== -->
  <g filter="url(#glow-sm)">
    <rect x="140" y="230" width="24" height="14" fill="none" stroke="#BD00FF" stroke-width="0.8" opacity="0.4"/>
    <line x1="148" y1="244" x2="148" y2="258" stroke="#BD00FF" stroke-width="0.6" opacity="0.3"/>
    <line x1="160" y1="244" x2="160" y2="258" stroke="#BD00FF" stroke-width="0.6" opacity="0.3"/>
    <!-- Smoke -->
    <circle cx="152" cy="225" r="2.5" fill="none" stroke="#666" stroke-width="0.5" opacity="0">
      <animate attributeName="cy" from="225" to="200" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.3;0.15;0" keyTimes="0;0.2;0.7;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" from="2.5" to="6" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== TEXT ===== -->
  <text x="50" y="290" class="txt" font-size="18" font-weight="bold" fill="url(#tg)" filter="url(#glow)">THE OUTDOOR LIFESTYLE</text>
  <text x="50" y="312" class="txt" font-size="10" fill="#888">Where comfort meets nature · Every evening is a celebration</text>

  <!-- Subtle data right side -->
  <text x="850" y="290" class="txt" font-size="9" fill="#444" text-anchor="end">greenvillagemobilehomes.com</text>

  <!-- Top accent line -->
  <line x1="0" y1="0" x2="900" y2="0" stroke="url(#tg)" stroke-width="2" opacity="0.6"/>
  <!-- Bottom draw line -->
  <line x1="50" y1="340" x2="850" y2="340" stroke="#BD00FF" stroke-width="1" stroke-dasharray="800" stroke-dashoffset="800" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="3s" fill="freeze"/>
  </line>
</svg>
