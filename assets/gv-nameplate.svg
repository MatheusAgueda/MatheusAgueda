<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes pulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
      @keyframes blink { 0%,49%,100% { opacity: 1; } 50%,99% { opacity: 0.2; } }
      .pulse { animation: pulse 3s infinite; }
      .blink { animation: blink 1.4s infinite; }
    </style>
  </defs>
  <rect width="900" height="120" fill="#06060e" rx="6"/>
  <rect x="1" y="1" width="898" height="118" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" rx="6" opacity="0.6"/>

  <!-- Mobile home icon -->
  <g transform="translate(30, 28)" filter="url(#glow)">
    <rect x="0" y="26" width="36" height="20" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    <polygon points="-3,26 39,26 18,8" fill="none" stroke="#FF2D95" stroke-width="1.5"/>
    <rect x="14" y="32" width="8" height="14" fill="none" stroke="#BD00FF" stroke-width="1"/>
    <circle cx="8" cy="50" r="3.5" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    <circle cx="28" cy="50" r="3.5" fill="none" stroke="#00D4FF" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" values="30,28;30,25;30,28" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Name -->
  <text x="450" y="50" font-family="'Courier New',monospace" font-size="28" font-weight="bold" fill="url(#neonGrad)" text-anchor="middle" filter="url(#glow)" class="pulse">MATHEUS AGUEDA</text>
  <text x="450" y="75" font-family="'Courier New',monospace" font-size="13" fill="#00D4FF" text-anchor="middle" opacity="0.8">CEO — Green Village Mobile Homes</text>

  <!-- Country dots with neon colors -->
  <g transform="translate(734, 50)">
    <circle cx="0" cy="0" r="6" fill="#FF2D95" class="pulse" filter="url(#glow)"/>
    <circle cx="22" cy="0" r="6" fill="#BD00FF" class="pulse" style="animation-delay:-.3s" filter="url(#glow)"/>
    <circle cx="44" cy="0" r="6" fill="#00D4FF" class="pulse" style="animation-delay:-.6s" filter="url(#glow)"/>
    <circle cx="66" cy="0" r="6" fill="#00ff41" class="pulse" style="animation-delay:-.9s" filter="url(#glow)"/>
  </g>
  <text x="734" y="70" font-family="'Courier New',monospace" font-size="8" fill="#555" text-anchor="start">PT &#160; FR &#160; NL &#160; ES</text>

  <!-- Bottom neon line -->
  <line x1="50" y1="112" x2="850" y2="112" stroke="url(#neonGrad)" stroke-width="2" stroke-dasharray="800" stroke-dashoffset="800" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="800" to="0" dur="2.5s" fill="freeze"/>
  </line>
</svg>
