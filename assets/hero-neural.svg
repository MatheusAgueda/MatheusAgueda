<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <style>
    @keyframes dash { to { stroke-dashoffset: -100; } }
    @keyframes flicker { 0%,100% { opacity: 0.9; } 50% { opacity: 0.35; } 52% { opacity: 1; } }
    @keyframes blink { 0%,49%,100% { opacity: 1; } 50%,99% { opacity: 0.15; } }
    @keyframes pulse-o { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes gauge1 { from { stroke-dashoffset: 440; } to { stroke-dashoffset: 26; } }
    @keyframes gauge2 { from { stroke-dashoffset: 440; } to { stroke-dashoffset: 16; } }
    @keyframes scan { 0% { opacity: 0; } 10% { opacity: 0.12; } 90% { opacity: 0.12; } 100% { opacity: 0; } }
    .bg { fill: #06060e; }
    .grid { stroke: #121228; stroke-width: 0.5; stroke-dasharray: 4 8; }
    .conn { stroke: #1a1a3a; stroke-width: 1; fill: none; }
    .conn-glow { stroke: url(#gf); stroke-width: 1.8; stroke-dasharray: 6 12; fill: none; animation: dash 4s linear infinite; }
    .txt { font-family: 'Courier New', monospace; }
    .t-h { font-size: 14px; font-weight: bold; fill: url(#gh); letter-spacing: 3px; }
    .t-m { font-size: 11px; fill: #00D4FF; letter-spacing: 1.5px; }
    .t-s { font-size: 9px; fill: #52527a; letter-spacing: 1px; }
    .t-v { font-size: 18px; font-weight: bold; letter-spacing: 2px; }
    .panel { fill: #0b0c1a; stroke: #1f2050; stroke-width: 1; rx: 4; }
    .g-bg { fill: none; stroke: #131738; stroke-width: 5; stroke-linecap: round; }
    .g1 { fill: none; stroke: #FF2D95; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 440; animation: gauge1 2.5s cubic-bezier(.1,.8,.3,1) forwards; }
    .g2 { fill: none; stroke: #00ff41; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 440; animation: gauge2 2.8s cubic-bezier(.1,.8,.3,1) forwards; }
    .blink { animation: blink 1.4s infinite; }
    .flick { animation: flicker 2.5s infinite; }
    .pulse { animation: pulse-o 3s ease-in-out infinite; }
  </style>
  <defs>
    <linearGradient id="gh" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="gf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2D95">
        <animate attributeName="stop-color" values="#FF2D95;#BD00FF;#00D4FF;#FF2D95" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00D4FF">
        <animate attributeName="stop-color" values="#00D4FF;#FF2D95;#BD00FF;#00D4FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="gc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BD00FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#06060e" stop-opacity="0"/>
    </radialGradient>
    <filter id="ng" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="p1" d="M120 100Q280 50 450 200"/>
    <path id="p2" d="M150 300Q300 350 450 200"/>
    <path id="p3" d="M450 200Q620 50 780 120"/>
    <path id="p4" d="M450 200Q600 350 750 280"/>
    <path id="p5" d="M80 200Q250 100 450 200"/>
    <path id="p6" d="M450 200Q650 300 820 200"/>
    <path id="p7" d="M200 50Q400 150 700 80"/>
    <path id="p8" d="M100 350Q450 250 800 340"/>
  </defs>

  <rect width="900" height="400" class="bg"/>
  <circle cx="450" cy="200" r="220" fill="url(#gc)"/>

  <!-- Grid -->
  <g class="grid" opacity="0.35">
    <line x1="0" y1="50" x2="900" y2="50"/><line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="250" x2="900" y2="250"/><line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="350" x2="900" y2="350"/>
    <line x1="150" y1="0" x2="150" y2="400"/><line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="750" y1="0" x2="750" y2="400"/>
  </g>

  <!-- Neural connections (background) -->
  <path d="M50 80L120 100L180 60L250 140L320 90L450 200" class="conn"/>
  <path d="M50 320L150 300L220 350L300 280L380 320L450 200" class="conn"/>
  <path d="M450 200L530 110L620 80L710 140L780 120L850 70" class="conn"/>
  <path d="M450 200L520 290L600 260L680 330L750 280L850 330" class="conn"/>
  <path d="M120 100L150 300" class="conn"/><path d="M250 140L220 350" class="conn"/>
  <path d="M320 90L380 320" class="conn"/><path d="M530 110L520 290" class="conn"/>
  <path d="M620 80L600 260" class="conn"/><path d="M710 140L680 330" class="conn"/>
  <path d="M180 60L320 90" class="conn"/><path d="M220 350L380 320" class="conn"/>
  <path d="M530 110L710 140" class="conn"/><path d="M520 290L680 330" class="conn"/>

  <!-- Glowing animated connections -->
  <path d="M50 80L120 100L250 140L450 200" class="conn-glow"/>
  <path d="M450 200L620 80L780 120L850 70" class="conn-glow" style="animation-delay:-2s"/>
  <path d="M50 320L220 350L380 320L450 200" class="conn-glow" style="animation-delay:-1s"/>
  <path d="M450 200L520 290L680 330L850 330" class="conn-glow" style="animation-delay:-3s"/>

  <!-- Travelling particles (SMIL) -->
  <circle r="3" fill="#FF2D95" filter="url(#ng)"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
  <circle r="2.5" fill="#00D4FF" filter="url(#ng)"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
  <circle r="3" fill="#00ff41" filter="url(#ng)"><animateMotion dur="3s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
  <circle r="3.5" fill="#BD00FF" filter="url(#ng)"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  <circle r="2" fill="#FF2D95" filter="url(#ng)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
  <circle r="2.5" fill="#00D4FF" filter="url(#ng)"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
  <circle r="2" fill="#BD00FF" filter="url(#ng)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#p7"/></animateMotion></circle>
  <circle r="2.5" fill="#00ff41" filter="url(#ng)"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#p8"/></animateMotion></circle>

  <!-- Network nodes (20+) -->
  <g filter="url(#ng)">
    <circle cx="50" cy="80" r="4" fill="#FF2D95" class="pulse"/>
    <circle cx="120" cy="100" r="6" fill="#00D4FF" class="pulse" style="animation-delay:-.5s"/>
    <circle cx="180" cy="60" r="3.5" fill="#BD00FF" class="pulse" style="animation-delay:-1s"/>
    <circle cx="250" cy="140" r="5" fill="#00ff41" class="pulse" style="animation-delay:-.2s"/>
    <circle cx="320" cy="90" r="4" fill="#FF2D95" class="pulse" style="animation-delay:-1.5s"/>
    <circle cx="50" cy="320" r="5" fill="#00D4FF" class="pulse" style="animation-delay:-.8s"/>
    <circle cx="150" cy="300" r="4.5" fill="#BD00FF" class="pulse" style="animation-delay:-2s"/>
    <circle cx="220" cy="350" r="6" fill="#FF2D95" class="pulse" style="animation-delay:-.3s"/>
    <circle cx="300" cy="280" r="3.5" fill="#00ff41" class="pulse" style="animation-delay:-1.2s"/>
    <circle cx="380" cy="320" r="5" fill="#00D4FF" class="pulse" style="animation-delay:-.7s"/>
    <circle cx="530" cy="110" r="5" fill="#BD00FF" class="pulse" style="animation-delay:-1.8s"/>
    <circle cx="620" cy="80" r="4" fill="#00ff41" class="pulse" style="animation-delay:-.4s"/>
    <circle cx="710" cy="140" r="6" fill="#FF2D95" class="pulse" style="animation-delay:-2.2s"/>
    <circle cx="780" cy="120" r="3.5" fill="#00D4FF" class="pulse" style="animation-delay:-.6s"/>
    <circle cx="850" cy="70" r="5" fill="#BD00FF" class="pulse" style="animation-delay:-1.1s"/>
    <circle cx="520" cy="290" r="4" fill="#00D4FF" class="pulse" style="animation-delay:-1.4s"/>
    <circle cx="600" cy="260" r="5.5" fill="#FF2D95" class="pulse" style="animation-delay:-.9s"/>
    <circle cx="680" cy="330" r="3.5" fill="#00ff41" class="pulse" style="animation-delay:-2.5s"/>
    <circle cx="750" cy="280" r="5" fill="#BD00FF" class="pulse" style="animation-delay:-.1s"/>
    <circle cx="850" cy="330" r="6" fill="#00D4FF" class="pulse" style="animation-delay:-1.7s"/>
  </g>

  <!-- Central hexagonal core (SMIL rotations) -->
  <g>
    <!-- Outer hex -->
    <polygon points="450,125 515,162.5 515,237.5 450,275 385,237.5 385,162.5" fill="none" stroke="#00D4FF" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 450 200" to="360 450 200" dur="25s" repeatCount="indefinite"/>
    </polygon>
    <!-- Inner hex -->
    <polygon points="450,150 493.3,175 493.3,225 450,250 406.7,225 406.7,175" fill="none" stroke="#BD00FF" stroke-width="2" stroke-dasharray="15 5" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="360 450 200" to="0 450 200" dur="15s" repeatCount="indefinite"/>
    </polygon>
    <!-- Core hex -->
    <polygon points="450,175 471.6,187.5 471.6,212.5 450,225 428.4,212.5 428.4,187.5" fill="#06060e" stroke="#FF2D95" stroke-width="2" filter="url(#ng)">
      <animateTransform attributeName="transform" type="rotate" from="0 450 200" to="360 450 200" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <!-- Hub dot -->
    <circle cx="450" cy="200" r="5" fill="#00ff41" class="blink"/>
    <!-- Corner markers on outer hex -->
    <circle cx="450" cy="125" r="3" fill="#FF2D95" class="pulse"/>
    <circle cx="515" cy="237.5" r="3" fill="#00ff41" class="pulse" style="animation-delay:-1s"/>
    <circle cx="385" cy="237.5" r="3" fill="#BD00FF" class="pulse" style="animation-delay:-2s"/>
  </g>

  <!-- Top-left panel: Fleet Brain -->
  <rect x="20" y="20" width="195" height="72" class="panel"/>
  <polygon points="20,20 30,20 20,30" fill="#00D4FF"/>
  <text x="35" y="40" class="txt t-h">FLEET BRAIN</text>
  <text x="35" y="57" class="txt t-m">MODELS: <tspan fill="#FF2D95">228</tspan></text>
  <text x="35" y="72" class="txt t-s">STATUS: OPTIMIZED [SYNC]</text>
  <rect x="170" y="49" width="4" height="4" fill="#00ff41" class="blink"/>
  <rect x="178" y="49" width="4" height="4" fill="#00ff41" class="blink" style="animation-delay:-.3s"/>
  <rect x="186" y="49" width="4" height="4" fill="#00ff41" class="blink" style="animation-delay:-.6s"/>
  <rect x="194" y="49" width="4" height="4" fill="#1f224f"/>

  <!-- Top-right panel: 94.2% -->
  <rect x="685" y="20" width="195" height="72" class="panel"/>
  <polygon points="880,20 870,20 880,30" fill="#FF2D95"/>
  <text x="700" y="40" class="txt t-m" fill="#FF2D95">FREE_ROUTING</text>
  <text x="700" y="65" class="txt t-v" fill="url(#gh)">94.2%</text>
  <text x="790" y="65" class="txt t-s" fill="#FF2D95">FREE</text>
  <!-- Mini gauge -->
  <g>
    <circle cx="855" cy="55" r="18" class="g-bg"/>
    <circle cx="855" cy="55" r="18" fill="none" stroke="#FF2D95" stroke-width="4" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="113">
      <animate attributeName="stroke-dashoffset" from="113" to="6.6" dur="2.5s" fill="freeze"/>
    </circle>
  </g>

  <!-- Bottom-left panel: WIS -->
  <rect x="20" y="308" width="195" height="72" class="panel"/>
  <polygon points="20,380 30,380 20,370" fill="#00ff41"/>
  <text x="35" y="330" class="txt t-m" fill="#00ff41">WIS_METRIC</text>
  <text x="35" y="358" class="txt t-v" fill="#00ff41">0.9643</text>
  <text x="140" y="358" class="txt t-s" fill="#00ff41">STABLE</text>
  <!-- Mini gauge -->
  <g>
    <circle cx="190" cy="345" r="18" class="g-bg"/>
    <circle cx="190" cy="345" r="18" fill="none" stroke="#00ff41" stroke-width="4" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="113">
      <animate attributeName="stroke-dashoffset" from="113" to="4" dur="2.8s" fill="freeze"/>
    </circle>
  </g>

  <!-- Bottom-right panel: Sys Log -->
  <rect x="685" y="308" width="195" height="72" class="panel"/>
  <polygon points="880,380 870,380 880,370" fill="#BD00FF"/>
  <text x="700" y="330" class="txt t-m" fill="#BD00FF">SYS.LOG</text>
  <text x="700" y="348" class="txt t-s flick">&gt; fleet.init() OK</text>
  <text x="700" y="360" class="txt t-s">&gt; weights_synced [228]</text>
  <text x="700" y="372" class="txt t-s" fill="#00ff41">&gt; latency: 0.14ms</text>

  <!-- HUD decorations -->
  <text x="30" y="200" class="txt t-s" opacity="0.5">X: 34.902.11</text>
  <text x="30" y="212" class="txt t-s" opacity="0.5">Y: 88.104.55</text>
  <text x="870" y="200" class="txt t-s" opacity="0.5" text-anchor="end">NODE: #409</text>
  <text x="870" y="212" class="txt t-s" opacity="0.5" text-anchor="end">SECURE_TUNNEL</text>
  <!-- Crosshair -->
  <line x1="440" y1="200" x2="445" y2="200" stroke="#00D4FF" stroke-width="0.7" opacity="0.5"/>
  <line x1="455" y1="200" x2="460" y2="200" stroke="#00D4FF" stroke-width="0.7" opacity="0.5"/>
  <line x1="450" y1="190" x2="450" y2="195" stroke="#00D4FF" stroke-width="0.7" opacity="0.5"/>
  <line x1="450" y1="205" x2="450" y2="210" stroke="#00D4FF" stroke-width="0.7" opacity="0.5"/>

  <!-- Gradient top bar -->
  <rect x="0" y="0" width="900" height="3" fill="url(#gh)"/>

  <!-- Scanlines -->
  <line x1="0" y1="120" x2="900" y2="120" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
  <line x1="0" y1="280" x2="900" y2="280" stroke="#FF2D95" stroke-width="0.5" opacity="0.1"/>

  <!-- Moving scanline -->
  <rect x="0" y="0" width="900" height="4" fill="#00D4FF" opacity="0">
    <animate attributeName="y" from="-4" to="400" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.08;0.08;0" keyTimes="0;0.05;0.95;1" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
