<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400">
  <style>
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes pulse-slow { 0%,100% { opacity: 0.3; } 50% { opacity: 0.85; } }
    @keyframes blink { 0%,49%,100% { opacity: 1; } 50%,99% { opacity: 0.15; } }
    @keyframes dash { to { stroke-dashoffset: -80; } }
    @keyframes flicker { 0%,100% { opacity: 0.8; } 30% { opacity: 1; } 50% { opacity: 0.3; } 52% { opacity: 1; } }
    .p { animation: pulse 3s ease-in-out infinite; }
    .ps { animation: pulse-slow 4s ease-in-out infinite; }
    .bl { animation: blink 1.4s infinite; }
    .fl { animation: flicker 2.5s infinite; }
    .wave { animation: dash 3s linear infinite; }
    .txt { font-family: 'Courier New', monospace; }
  </style>
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="pool-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#BD00FF"/>
    </linearGradient>
    <!-- Particle paths -->
    <path id="pp1" d="M160,140 C300,100 400,180 450,200"/>
    <path id="pp2" d="M740,140 C600,100 500,180 450,200"/>
    <path id="pp3" d="M160,300 C300,340 400,240 450,220"/>
    <path id="pp4" d="M740,300 C600,340 500,240 450,220"/>
    <path id="pp5" d="M300,100 C350,200 500,300 700,280"/>
    <path id="pp6" d="M200,350 C350,250 550,150 800,120"/>
    <path id="pp7" d="M100,200 C250,150 650,250 850,200"/>
    <path id="pp8" d="M450,80 C350,200 550,300 450,380"/>
  </defs>

  <!-- Background -->
  <rect width="900" height="400" fill="#06060e"/>

  <!-- Grid -->
  <g opacity="0.25">
    <line x1="0" y1="80" x2="900" y2="80" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="0" y1="320" x2="900" y2="320" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="150" y1="0" x2="150" y2="400" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="450" y1="0" x2="450" y2="400" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
    <line x1="750" y1="0" x2="750" y2="400" stroke="#121228" stroke-width="0.5" stroke-dasharray="4 8"/>
  </g>

  <!-- Title -->
  <text x="450" y="42" class="txt" font-size="18" font-weight="bold" fill="url(#title-grad)" text-anchor="middle" letter-spacing="5" filter="url(#glow)">GREEN VILLAGE MOBILE HOMES</text>
  <text x="450" y="62" class="txt" font-size="10" fill="#52527a" text-anchor="middle" letter-spacing="2">HOLOGRAPHIC BLUEPRINT · NEON EDITION</text>

  <!-- Top gradient bar -->
  <rect x="0" y="0" width="900" height="3" fill="url(#title-grad)"/>

  <!-- ====== ROADS / PATHS ====== -->
  <g stroke="#1a1a3a" stroke-width="1" fill="none" stroke-dasharray="6 4">
    <!-- Horizontal main road -->
    <line x1="80" y1="210" x2="820" y2="210"/>
    <!-- Vertical main road -->
    <line x1="450" y1="80" x2="450" y2="360"/>
    <!-- Diagonals to homes -->
    <line x1="160" y1="140" x2="380" y2="190"/>
    <line x1="740" y1="140" x2="520" y2="190"/>
    <line x1="160" y1="300" x2="380" y2="230"/>
    <line x1="740" y1="300" x2="520" y2="230"/>
    <line x1="300" y1="110" x2="420" y2="190"/>
    <line x1="600" y1="320" x2="490" y2="230"/>
  </g>

  <!-- ====== SWIMMING POOL (center) ====== -->
  <g filter="url(#glow)">
    <rect x="400" y="180" width="100" height="55" rx="12" fill="none" stroke="url(#pool-grad)" stroke-width="2.5"/>
    <!-- Water wave lines -->
    <path d="M412,195 Q425,190 438,195 Q451,200 464,195 Q477,190 490,195" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.6" stroke-dasharray="8 6" class="wave"/>
    <path d="M412,207 Q425,202 438,207 Q451,212 464,207 Q477,202 490,207" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.4" stroke-dasharray="8 6" class="wave" style="animation-delay:-1.5s"/>
    <path d="M412,219 Q425,214 438,219 Q451,224 464,219 Q477,214 490,219" fill="none" stroke="#BD00FF" stroke-width="1" opacity="0.3" stroke-dasharray="8 6" class="wave" style="animation-delay:-0.8s"/>
    <!-- Pool label -->
    <text x="450" y="247" class="txt" font-size="7" fill="#00D4FF" text-anchor="middle" opacity="0.6">POOL</text>
  </g>

  <!-- ====== MOBILE HOME 1 (top-left) — pink ====== -->
  <g filter="url(#glow)">
    <rect x="120" y="110" width="80" height="42" rx="2" fill="none" stroke="#FF2D95" stroke-width="2"/>
    <!-- Door -->
    <rect x="152" y="138" width="12" height="14" fill="none" stroke="#FF2D95" stroke-width="1" class="p"/>
    <!-- Windows -->
    <rect x="128" y="118" width="10" height="8" fill="none" stroke="#FF2D95" stroke-width="0.8" class="p" style="animation-delay:-1s"/>
    <rect x="172" y="118" width="10" height="8" fill="none" stroke="#FF2D95" stroke-width="0.8" class="p" style="animation-delay:-2s"/>
    <!-- Deck -->
    <line x1="120" y1="152" x2="200" y2="152" stroke="#FF2D95" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>
    <!-- Wheels -->
    <circle cx="135" cy="155" r="3" fill="none" stroke="#FF2D95" stroke-width="0.8" opacity="0.5"/>
    <circle cx="185" cy="155" r="3" fill="none" stroke="#FF2D95" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ====== MOBILE HOME 2 (top-center) — cyan ====== -->
  <g filter="url(#glow)">
    <rect x="270" y="85" width="85" height="45" rx="2" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <rect x="305" y="116" width="12" height="14" fill="none" stroke="#00D4FF" stroke-width="1" class="p" style="animation-delay:-.5s"/>
    <rect x="278" y="93" width="10" height="8" fill="none" stroke="#00D4FF" stroke-width="0.8" class="p" style="animation-delay:-1.5s"/>
    <rect x="335" y="93" width="10" height="8" fill="none" stroke="#00D4FF" stroke-width="0.8" class="p" style="animation-delay:-2.5s"/>
    <line x1="270" y1="130" x2="355" y2="130" stroke="#00D4FF" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>
    <circle cx="285" cy="133" r="3" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.5"/>
    <circle cx="340" cy="133" r="3" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ====== MOBILE HOME 3 (top-right) — purple ====== -->
  <g filter="url(#glow)">
    <rect x="700" y="110" width="80" height="42" rx="2" fill="none" stroke="#BD00FF" stroke-width="2"/>
    <rect x="732" y="138" width="12" height="14" fill="none" stroke="#BD00FF" stroke-width="1" class="p" style="animation-delay:-1s"/>
    <rect x="708" y="118" width="10" height="8" fill="none" stroke="#BD00FF" stroke-width="0.8" class="p" style="animation-delay:-.3s"/>
    <rect x="762" y="118" width="10" height="8" fill="none" stroke="#BD00FF" stroke-width="0.8" class="p" style="animation-delay:-1.8s"/>
    <line x1="700" y1="152" x2="780" y2="152" stroke="#BD00FF" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>
    <circle cx="715" cy="155" r="3" fill="none" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
    <circle cx="765" cy="155" r="3" fill="none" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ====== MOBILE HOME 4 (bottom-left) — cyan ====== -->
  <g filter="url(#glow)">
    <rect x="120" y="275" width="80" height="42" rx="2" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <rect x="152" y="275" width="12" height="14" fill="none" stroke="#00D4FF" stroke-width="1" class="p" style="animation-delay:-2s"/>
    <rect x="128" y="295" width="10" height="8" fill="none" stroke="#00D4FF" stroke-width="0.8" class="p" style="animation-delay:-.7s"/>
    <rect x="172" y="295" width="10" height="8" fill="none" stroke="#00D4FF" stroke-width="0.8" class="p" style="animation-delay:-2.2s"/>
    <line x1="120" y1="317" x2="200" y2="317" stroke="#00D4FF" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>
    <circle cx="135" cy="320" r="3" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.5"/>
    <circle cx="185" cy="320" r="3" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ====== MOBILE HOME 5 (bottom-center) — pink ====== -->
  <g filter="url(#glow)">
    <rect x="560" y="290" width="85" height="45" rx="2" fill="none" stroke="#FF2D95" stroke-width="2"/>
    <rect x="595" y="290" width="12" height="14" fill="none" stroke="#FF2D95" stroke-width="1" class="p" style="animation-delay:-.8s"/>
    <rect x="568" y="310" width="10" height="8" fill="none" stroke="#FF2D95" stroke-width="0.8" class="p" style="animation-delay:-1.3s"/>
    <rect x="627" y="310" width="10" height="8" fill="none" stroke="#FF2D95" stroke-width="0.8" class="p" style="animation-delay:-2.8s"/>
    <line x1="560" y1="335" x2="645" y2="335" stroke="#FF2D95" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>
    <circle cx="575" cy="338" r="3" fill="none" stroke="#FF2D95" stroke-width="0.8" opacity="0.5"/>
    <circle cx="630" cy="338" r="3" fill="none" stroke="#FF2D95" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ====== MOBILE HOME 6 (bottom-right) — purple ====== -->
  <g filter="url(#glow)">
    <rect x="700" y="275" width="80" height="42" rx="2" fill="none" stroke="#BD00FF" stroke-width="2"/>
    <rect x="732" y="275" width="12" height="14" fill="none" stroke="#BD00FF" stroke-width="1" class="p" style="animation-delay:-1.5s"/>
    <rect x="708" y="295" width="10" height="8" fill="none" stroke="#BD00FF" stroke-width="0.8" class="p" style="animation-delay:-.4s"/>
    <rect x="762" y="295" width="10" height="8" fill="none" stroke="#BD00FF" stroke-width="0.8" class="p" style="animation-delay:-2.4s"/>
    <line x1="700" y1="317" x2="780" y2="317" stroke="#BD00FF" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.5"/>
    <circle cx="715" cy="320" r="3" fill="none" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
    <circle cx="765" cy="320" r="3" fill="none" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- ====== TREES ====== -->
  <g filter="url(#glow-soft)">
    <circle cx="230" cy="180" r="12" fill="none" stroke="#00ff41" stroke-width="1.5" class="ps"/>
    <circle cx="250" cy="250" r="9" fill="none" stroke="#00ff41" stroke-width="1.2" class="ps" style="animation-delay:-1s"/>
    <circle cx="85" cy="210" r="14" fill="none" stroke="#00ff41" stroke-width="1.5" class="ps" style="animation-delay:-2s"/>
    <circle cx="670" cy="180" r="11" fill="none" stroke="#00ff41" stroke-width="1.3" class="ps" style="animation-delay:-.5s"/>
    <circle cx="650" cy="260" r="13" fill="none" stroke="#00ff41" stroke-width="1.5" class="ps" style="animation-delay:-1.5s"/>
    <circle cx="820" cy="210" r="10" fill="none" stroke="#00ff41" stroke-width="1.2" class="ps" style="animation-delay:-2.5s"/>
    <circle cx="350" cy="260" r="8" fill="none" stroke="#00ff41" stroke-width="1" class="ps" style="animation-delay:-3s"/>
    <circle cx="520" cy="140" r="10" fill="none" stroke="#00ff41" stroke-width="1.2" class="ps" style="animation-delay:-.8s"/>
    <circle cx="380" cy="330" r="15" fill="none" stroke="#00ff41" stroke-width="1.5" class="ps" style="animation-delay:-1.8s"/>
    <circle cx="500" cy="310" r="9" fill="none" stroke="#00ff41" stroke-width="1" class="ps" style="animation-delay:-2.3s"/>
  </g>

  <!-- ====== INTERSECTION NODES ====== -->
  <g filter="url(#glow)">
    <circle cx="450" cy="210" r="4" fill="#00D4FF" class="bl"/>
    <circle cx="380" cy="190" r="3" fill="#FF2D95" class="bl" style="animation-delay:-.3s"/>
    <circle cx="520" cy="190" r="3" fill="#BD00FF" class="bl" style="animation-delay:-.7s"/>
    <circle cx="380" cy="230" r="3" fill="#FF2D95" class="bl" style="animation-delay:-1s"/>
    <circle cx="520" cy="230" r="3" fill="#BD00FF" class="bl" style="animation-delay:-1.3s"/>
    <circle cx="300" cy="210" r="2.5" fill="#00D4FF" class="bl" style="animation-delay:-.5s"/>
    <circle cx="600" cy="210" r="2.5" fill="#00D4FF" class="bl" style="animation-delay:-.9s"/>
    <circle cx="450" cy="150" r="2.5" fill="#00ff41" class="bl" style="animation-delay:-1.5s"/>
    <circle cx="450" cy="280" r="2.5" fill="#00ff41" class="bl" style="animation-delay:-1.8s"/>
  </g>

  <!-- ====== ANIMATED PARTICLES ====== -->
  <circle r="2.5" fill="#FF2D95" filter="url(#glow)"><animateMotion dur="3.5s" repeatCount="indefinite"><mpath href="#pp1"/></animateMotion></circle>
  <circle r="2.5" fill="#00D4FF" filter="url(#glow)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#pp2"/></animateMotion></circle>
  <circle r="2" fill="#BD00FF" filter="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#pp3"/></animateMotion></circle>
  <circle r="2" fill="#00ff41" filter="url(#glow)"><animateMotion dur="3.8s" repeatCount="indefinite"><mpath href="#pp4"/></animateMotion></circle>
  <circle r="3" fill="#FF2D95" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#pp5"/></animateMotion></circle>
  <circle r="2" fill="#00D4FF" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#pp6"/></animateMotion></circle>
  <circle r="2.5" fill="#BD00FF" filter="url(#glow)"><animateMotion dur="5.5s" repeatCount="indefinite"><mpath href="#pp7"/></animateMotion></circle>
  <circle r="2" fill="#00ff41" filter="url(#glow)"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#pp8"/></animateMotion></circle>

  <!-- ====== HUD CORNERS ====== -->
  <!-- Top-left corner bracket -->
  <path d="M30,75 L30,70 L55,70" fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.5"/>
  <path d="M870,75 L870,70 L845,70" fill="none" stroke="#FF2D95" stroke-width="1" opacity="0.5"/>
  <path d="M30,365 L30,370 L55,370" fill="none" stroke="#BD00FF" stroke-width="1" opacity="0.5"/>
  <path d="M870,365 L870,370 L845,370" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.5"/>

  <!-- ====== STATS PANEL (bottom-right) ====== -->
  <rect x="660" y="355" width="230" height="38" rx="3" fill="#0b0c1a" stroke="#1f2050" stroke-width="1"/>
  <text x="675" y="370" class="txt" font-size="8" fill="#00D4FF" letter-spacing="1">1.93M LEADS</text>
  <text x="675" y="384" class="txt" font-size="8" fill="#FF2D95" letter-spacing="1">228 MODELS</text>
  <text x="795" y="370" class="txt" font-size="8" fill="#BD00FF" letter-spacing="1">385/DAY</text>
  <text x="795" y="384" class="txt" font-size="8" fill="#00ff41" letter-spacing="1">WIS 0.9643</text>
  <!-- Blinking dot -->
  <circle cx="880" cy="360" r="2.5" fill="#00ff41" class="bl"/>

  <!-- ====== COORDINATES PANEL (bottom-left) ====== -->
  <rect x="10" y="355" width="150" height="38" rx="3" fill="#0b0c1a" stroke="#1f2050" stroke-width="1"/>
  <text x="20" y="370" class="txt" font-size="7" fill="#52527a">LAT: 41.1496° N</text>
  <text x="20" y="384" class="txt" font-size="7" fill="#52527a">LON: 8.6109° W</text>
  <text x="105" y="370" class="txt" font-size="7" fill="#00ff41" class="fl">LIVE</text>

  <!-- ====== SCANLINE ====== -->
  <rect x="0" y="0" width="900" height="3" fill="#00D4FF" opacity="0">
    <animate attributeName="y" from="-3" to="400" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.08;0.08;0" keyTimes="0;0.05;0.95;1" dur="7s" repeatCount="indefinite"/>
  </rect>

  <!-- ====== BOTTOM GRADIENT BAR ====== -->
  <rect x="0" y="397" width="900" height="3" fill="url(#title-grad)"/>
</svg>
