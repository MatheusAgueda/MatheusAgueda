<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300">
  <defs>
    <style>
      @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
      @keyframes slideRight{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
      @keyframes countPulse{0%,100%{fill:#fff}50%{fill:#00D4FF}}
      @keyframes dotPulse{0%,100%{r:3}50%{r:5}}
      @keyframes borderShimmer{0%{stroke:#1a1a2e}33%{stroke:#FF2D9540}66%{stroke:#BD00FF40}100%{stroke:#1a1a2e}}
      @keyframes iconSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
      @keyframes textGlow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 6px currentColor)}}
      @keyframes progressFill{0%{stroke-dashoffset:157}100%{stroke-dashoffset:var(--target)}}
      @keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-420px)}}

      .bg{fill:#06060e}
      .panel{fill:#0a0a14;stroke:#1a1a2e;stroke-width:1;rx:8}
      .panel-shimmer{fill:none;stroke:#1a1a2e;stroke-width:1;rx:8;animation:borderShimmer 6s ease-in-out infinite}
      .section-title{font-family:'SF Mono','JetBrains Mono',monospace;font-size:9px;fill:#5a5a7a;letter-spacing:2px}
      .tech-name{font-family:'SF Mono','JetBrains Mono',monospace;font-size:10px;fill:#ccc;font-weight:600}
      .tech-detail{font-family:'SF Mono','JetBrains Mono',monospace;font-size:8px;fill:#5a5a7a}
      .pct{font-family:'SF Mono','JetBrains Mono',monospace;font-size:10px;fill:#fff;font-weight:700;text-anchor:end}
      .big-num{font-family:'SF Mono','JetBrains Mono',monospace;font-size:24px;fill:#fff;font-weight:700;text-anchor:middle}
      .big-label{font-family:'SF Mono','JetBrains Mono',monospace;font-size:8px;fill:#5a5a7a;text-anchor:middle;letter-spacing:1px}
      .bar-bg{fill:#12121e;rx:3;height:6px}
      .ticker{font-family:'SF Mono','JetBrains Mono',monospace;font-size:8px;fill:#3a3a5a}
      .gauge-bg{fill:none;stroke:#12121e;stroke-width:5;stroke-linecap:round}
      .r1{opacity:0;animation:fadeIn .4s ease forwards .3s}
      .r2{opacity:0;animation:fadeIn .4s ease forwards .6s}
      .r3{opacity:0;animation:fadeIn .4s ease forwards .9s}
      .r4{opacity:0;animation:fadeIn .4s ease forwards 1.2s}
      .r5{opacity:0;animation:fadeIn .4s ease forwards 1.5s}
      .r6{opacity:0;animation:fadeIn .4s ease forwards 1.8s}
      .r7{opacity:0;animation:fadeIn .4s ease forwards 2.1s}
      .r8{opacity:0;animation:fadeIn .4s ease forwards 2.4s}
    </style>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="pinkBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="100%" stop-color="#FF2D9580"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#00D4FF80"/>
    </linearGradient>
    <linearGradient id="purpleBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#BD00FF80"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="#00ff4180"/>
    </linearGradient>
    <clipPath id="c"><rect width="840" height="300" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#c)">
    <rect width="840" height="300" class="bg" rx="10"/>
    <rect width="840" height="2" fill="url(#hdr)"/>

    <!-- ═══ LEFT: TECH BARS ═══ -->
    <g class="r1">
      <rect x="16" y="14" width="500" height="250" class="panel"/>
      <rect x="16" y="14" width="500" height="250" class="panel-shimmer"/>
      <text x="30" y="34" class="section-title">TECH STACK PROFICIENCY</text>
    </g>

    <!-- Row 1: Node.js -->
    <g class="r2">
      <text x="30" y="58" class="tech-name" fill="#00ff41">Node.js</text>
      <text x="110" y="58" class="tech-detail">ES Modules · Pino · BullMQ</text>
      <text x="498" y="58" class="pct" fill="#00ff41">95%</text>
      <rect x="30" y="64" width="460" height="6" class="bar-bg"/>
      <rect x="30" y="64" width="437" height="6" rx="3" fill="url(#greenBar)" style="transform-origin:30px 67px;animation:slideRight 1.5s ease forwards .6s;transform:scaleX(0)"/>
    </g>

    <!-- Row 2: Python -->
    <g class="r3">
      <text x="30" y="88" class="tech-name" fill="#00D4FF">Python</text>
      <text x="100" y="88" class="tech-detail">3.14 · aiohttp · Playwright · ML</text>
      <text x="498" y="88" class="pct" fill="#00D4FF">92%</text>
      <rect x="30" y="94" width="460" height="6" class="bar-bg"/>
      <rect x="30" y="94" width="423" height="6" rx="3" fill="url(#cyanBar)" style="transform-origin:30px 97px;animation:slideRight 1.5s ease forwards .9s;transform:scaleX(0)"/>
    </g>

    <!-- Row 3: PostgreSQL -->
    <g class="r4">
      <text x="30" y="118" class="tech-name" fill="#BD00FF">PostgreSQL</text>
      <text x="120" y="118" class="tech-detail">PG16 · 6GB shared · 1.93M rows</text>
      <text x="498" y="118" class="pct" fill="#BD00FF">88%</text>
      <rect x="30" y="124" width="460" height="6" class="bar-bg"/>
      <rect x="30" y="124" width="405" height="6" rx="3" fill="url(#purpleBar)" style="transform-origin:30px 127px;animation:slideRight 1.5s ease forwards 1.2s;transform:scaleX(0)"/>
    </g>

    <!-- Row 4: Next.js / React -->
    <g class="r5">
      <text x="30" y="148" class="tech-name" fill="#FF2D95">Next.js 15</text>
      <text x="120" y="148" class="tech-detail">React 19 · Tailwind 4 · Prisma 6</text>
      <text x="498" y="148" class="pct" fill="#FF2D95">85%</text>
      <rect x="30" y="154" width="460" height="6" class="bar-bg"/>
      <rect x="30" y="154" width="391" height="6" rx="3" fill="url(#pinkBar)" style="transform-origin:30px 157px;animation:slideRight 1.5s ease forwards 1.5s;transform:scaleX(0)"/>
    </g>

    <!-- Row 5: TypeScript -->
    <g class="r6">
      <text x="30" y="178" class="tech-name" fill="#00D4FF">TypeScript</text>
      <text x="120" y="178" class="tech-detail">NestJS 11 · Zod · tRPC</text>
      <text x="498" y="178" class="pct" fill="#00D4FF">83%</text>
      <rect x="30" y="184" width="460" height="6" class="bar-bg"/>
      <rect x="30" y="184" width="382" height="6" rx="3" fill="url(#cyanBar)" style="transform-origin:30px 187px;animation:slideRight 1.5s ease forwards 1.8s;transform:scaleX(0)"/>
    </g>

    <!-- Row 6: DevOps -->
    <g class="r7">
      <text x="30" y="208" class="tech-name" fill="#00ff41">DevOps</text>
      <text x="100" y="208" class="tech-detail">Docker · Railway · Hetzner · GH Actions</text>
      <text x="498" y="208" class="pct" fill="#00ff41">80%</text>
      <rect x="30" y="214" width="460" height="6" class="bar-bg"/>
      <rect x="30" y="214" width="368" height="6" rx="3" fill="url(#greenBar)" style="transform-origin:30px 217px;animation:slideRight 1.5s ease forwards 2.1s;transform:scaleX(0)"/>
    </g>

    <!-- Row 7: AI / ML -->
    <g class="r8">
      <text x="30" y="238" class="tech-name" fill="#BD00FF">AI Engineering</text>
      <text x="140" y="238" class="tech-detail">Fleet Brain · Thompson · RAG · Agents</text>
      <text x="498" y="238" class="pct" fill="#BD00FF">90%</text>
      <rect x="30" y="244" width="460" height="6" class="bar-bg"/>
      <rect x="30" y="244" width="414" height="6" rx="3" fill="url(#purpleBar)" style="transform-origin:30px 247px;animation:slideRight 1.5s ease forwards 2.4s;transform:scaleX(0)"/>
    </g>

    <!-- ═══ RIGHT: METRIC CIRCLES ═══ -->
    <g class="r2">
      <rect x="530" y="14" width="294" height="120" class="panel"/>
      <text x="544" y="34" class="section-title">PRODUCTION METRICS</text>

      <!-- Circle 1: Repos -->
      <circle cx="580" cy="82" r="25" class="gauge-bg"/>
      <circle cx="580" cy="82" r="25" fill="none" stroke="#FF2D95" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="157" stroke-dashoffset="157" transform="rotate(-90 580 82)">
        <animate attributeName="stroke-dashoffset" from="157" to="18" dur="2s" fill="freeze" begin=".5s"/>
      </circle>
      <text x="580" y="86" class="big-num" style="font-size:16px;fill:#FF2D95">39</text>
      <text x="580" y="118" class="big-label">REPOS</text>

      <!-- Circle 2: Agents -->
      <circle cx="677" cy="82" r="25" class="gauge-bg"/>
      <circle cx="677" cy="82" r="25" fill="none" stroke="#00D4FF" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="157" stroke-dashoffset="157" transform="rotate(-90 677 82)">
        <animate attributeName="stroke-dashoffset" from="157" to="88" dur="2s" fill="freeze" begin=".8s"/>
      </circle>
      <text x="677" y="86" class="big-num" style="font-size:16px;fill:#00D4FF">17</text>
      <text x="677" y="118" class="big-label">AGENTS</text>

      <!-- Circle 3: Countries -->
      <circle cx="774" cy="82" r="25" class="gauge-bg"/>
      <circle cx="774" cy="82" r="25" fill="none" stroke="#BD00FF" stroke-width="5" stroke-linecap="round"
        stroke-dasharray="157" stroke-dashoffset="157" transform="rotate(-90 774 82)">
        <animate attributeName="stroke-dashoffset" from="157" to="120" dur="2s" fill="freeze" begin="1.1s"/>
      </circle>
      <text x="774" y="86" class="big-num" style="font-size:16px;fill:#BD00FF">4</text>
      <text x="774" y="118" class="big-label">COUNTRIES</text>
    </g>

    <!-- ═══ RIGHT BOTTOM: LIVE SYSTEMS ═══ -->
    <g class="r5">
      <rect x="530" y="144" width="294" height="120" class="panel"/>
      <text x="544" y="164" class="section-title">ACTIVE SYSTEMS</text>

      <circle cx="548" cy="180" r="3" fill="#00ff41">
        <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="558" y="183" class="tech-name" style="font-size:9px;fill:#ccc">Lead Scraper</text>
      <text x="808" y="183" class="tech-detail" style="text-anchor:end;fill:#FF2D95">1.93M leads</text>

      <circle cx="548" cy="198" r="3" fill="#00ff41">
        <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin=".3s"/>
      </circle>
      <text x="558" y="201" class="tech-name" style="font-size:9px;fill:#ccc">Fleet Brain</text>
      <text x="808" y="201" class="tech-detail" style="text-anchor:end;fill:#BD00FF">228 models</text>

      <circle cx="548" cy="216" r="3" fill="#00ff41">
        <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin=".6s"/>
      </circle>
      <text x="558" y="219" class="tech-name" style="font-size:9px;fill:#ccc">MHL Platform</text>
      <text x="808" y="219" class="tech-detail" style="text-anchor:end;fill:#00D4FF">Next.js 15</text>

      <circle cx="548" cy="234" r="3" fill="#00ff41">
        <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin=".9s"/>
      </circle>
      <text x="558" y="237" class="tech-name" style="font-size:9px;fill:#ccc">Email Engine</text>
      <text x="808" y="237" class="tech-detail" style="text-anchor:end;fill:#00ff41">385/day DKIM</text>

      <circle cx="548" cy="252" r="3" fill="#00ff41">
        <animate attributeName="r" values="3;4;3" dur="2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
      <text x="558" y="255" class="tech-name" style="font-size:9px;fill:#ccc">Trading Bot</text>
      <text x="808" y="255" class="tech-detail" style="text-anchor:end;fill:#FF2D95">MQL5 + Moon</text>
    </g>

    <!-- ═══ BOTTOM TICKER ═══ -->
    <rect x="0" y="274" width="840" height="26" fill="#08080f"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="840 0" to="0 0" dur="20s" repeatCount="indefinite"/>
      <text y="291" class="ticker">
        <tspan fill="#FF2D95">NODE.JS</tspan><tspan> · </tspan>
        <tspan fill="#00D4FF">PYTHON 3.14</tspan><tspan> · </tspan>
        <tspan fill="#BD00FF">POSTGRESQL</tspan><tspan> · </tspan>
        <tspan fill="#00ff41">NEXT.JS 15</tspan><tspan> · </tspan>
        <tspan fill="#FF2D95">NESTJS 11</tspan><tspan> · </tspan>
        <tspan fill="#00D4FF">PRISMA 6</tspan><tspan> · </tspan>
        <tspan fill="#BD00FF">REACT 19</tspan><tspan> · </tspan>
        <tspan fill="#00ff41">TAILWIND 4</tspan><tspan> · </tspan>
        <tspan fill="#FF2D95">DOCKER</tspan><tspan> · </tspan>
        <tspan fill="#00D4FF">RAILWAY</tspan><tspan> · </tspan>
        <tspan fill="#BD00FF">HETZNER</tspan><tspan> · </tspan>
        <tspan fill="#00ff41">GITHUB ACTIONS</tspan><tspan> · </tspan>
        <tspan fill="#FF2D95">PINO</tspan><tspan> · </tspan>
        <tspan fill="#00D4FF">BULLMQ</tspan><tspan> · </tspan>
        <tspan fill="#BD00FF">REDIS</tspan><tspan> · </tspan>
        <tspan fill="#00ff41">PLAYWRIGHT</tspan><tspan> · </tspan>
        <tspan fill="#FF2D95">MQL5</tspan><tspan> · </tspan>
        <tspan fill="#00D4FF">METAL API</tspan><tspan> · </tspan>
        <tspan fill="#BD00FF">THOMPSON SAMPLING</tspan><tspan> · </tspan>
        <tspan fill="#00ff41">UCB1</tspan><tspan> · </tspan>
        <tspan fill="#FF2D95">RAG</tspan><tspan> · </tspan>
        <tspan fill="#00D4FF">SMIL</tspan>
      </text>
    </g>
  </g>
</svg>
