<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <style>
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes pulse2 { 0%,100% { opacity: 0.3; } 50% { opacity: 0.85; } }
    @keyframes blink { 0%,49%,100% { opacity: 1; } 50%,99% { opacity: 0.15; } }
    @keyframes flicker { 0%,100% { opacity: 0.8; } 30% { opacity: 1; } 50% { opacity: 0.25; } 52% { opacity: 1; } }
    .p { animation: pulse 3s ease-in-out infinite; }
    .p2 { animation: pulse2 4s ease-in-out infinite; }
    .bl { animation: blink 1.4s infinite; }
    .fl { animation: flicker 2.5s infinite; }
    .mono { font-family: 'Courier New', monospace; }
  </style>
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="350" fill="#06060e"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#tg)"/>

  <!-- ====== STATIC CARAVAN (proper wide bungalow shape) ====== -->
  <g filter="url(#g)">
    <!-- Foundation blocks -->
    <rect x="92" y="237" width="12" height="10" fill="none" stroke="#FF2D95" stroke-width="0.6" opacity="0.3"/>
    <rect x="175" y="237" width="12" height="10" fill="none" stroke="#FF2D95" stroke-width="0.6" opacity="0.3"/>
    <rect x="265" y="237" width="12" height="10" fill="none" stroke="#FF2D95" stroke-width="0.6" opacity="0.3"/>
    <rect x="340" y="237" width="12" height="10" fill="none" stroke="#FF2D95" stroke-width="0.6" opacity="0.3"/>

    <!-- Body: wide, low bungalow proportions -->
    <rect x="80" y="145" width="285" height="92" rx="3" fill="none" stroke="#FF2D95" stroke-width="2.5"/>

    <!-- Horizontal cladding/siding lines -->
    <line x1="80" y1="160" x2="365" y2="160" stroke="#FF2D95" stroke-width="0.3" opacity="0.15"/>
    <line x1="80" y1="175" x2="365" y2="175" stroke="#FF2D95" stroke-width="0.3" opacity="0.15"/>
    <line x1="80" y1="190" x2="365" y2="190" stroke="#FF2D95" stroke-width="0.3" opacity="0.15"/>
    <line x1="80" y1="205" x2="365" y2="205" stroke="#FF2D95" stroke-width="0.3" opacity="0.15"/>
    <line x1="80" y1="220" x2="365" y2="220" stroke="#FF2D95" stroke-width="0.3" opacity="0.15"/>

    <!-- Roof: low-pitch gable with ridge -->
    <polygon points="70,145 222,100 375,145" fill="none" stroke="#FF2D95" stroke-width="2"/>
    <!-- Ridge line -->
    <line x1="222" y1="100" x2="222" y2="145" stroke="#FF2D95" stroke-width="0.5" opacity="0.2"/>

    <!-- Large panoramic windows (wider than tall, with mullions) -->
    <!-- Window 1: living room bay -->
    <rect x="100" y="158" width="65" height="35" rx="2" fill="none" stroke="#00D4FF" stroke-width="1.5" class="p" style="animation-delay:-.5s"/>
    <rect x="104" y="162" width="57" height="27" fill="#fbbf24" opacity="0.08" class="p" style="animation-delay:-.5s"/>
    <line x1="133" y1="158" x2="133" y2="193" stroke="#00D4FF" stroke-width="0.7" opacity="0.5"/>

    <!-- Window 2 -->
    <rect x="180" y="158" width="45" height="30" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2" class="p" style="animation-delay:-1s"/>
    <rect x="183" y="161" width="39" height="24" fill="#fbbf24" opacity="0.06" class="p" style="animation-delay:-1s"/>
    <line x1="203" y1="158" x2="203" y2="188" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>

    <!-- Small bathroom window -->
    <rect x="242" y="162" width="22" height="18" rx="1" fill="none" stroke="#00D4FF" stroke-width="0.8" class="p" style="animation-delay:-1.5s"/>
    <rect x="245" y="165" width="16" height="12" fill="#fbbf24" opacity="0.04" class="p" style="animation-delay:-1.5s"/>

    <!-- Window 3: bedroom -->
    <rect x="290" y="158" width="50" height="30" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2" class="p" style="animation-delay:-2s"/>
    <rect x="293" y="161" width="44" height="24" fill="#fbbf24" opacity="0.06" class="p" style="animation-delay:-2s"/>
    <line x1="315" y1="158" x2="315" y2="188" stroke="#00D4FF" stroke-width="0.6" opacity="0.4"/>

    <!-- Door -->
    <rect x="240" y="200" width="28" height="37" rx="2" fill="none" stroke="#BD00FF" stroke-width="1.5" class="p"/>
    <circle cx="262" cy="221" r="2.5" fill="#BD00FF" class="bl"/>
    <!-- Door glass panel -->
    <rect x="246" y="205" width="16" height="14" rx="1" fill="none" stroke="#BD00FF" stroke-width="0.6" opacity="0.4"/>

    <!-- Front deck/veranda with railing -->
    <rect x="220" y="237" width="60" height="22" fill="none" stroke="#FF2D95" stroke-width="1" opacity="0.5"/>
    <!-- Railing posts -->
    <line x1="220" y1="237" x2="220" y2="248" stroke="#FF2D95" stroke-width="0.7" opacity="0.4"/>
    <line x1="250" y1="237" x2="250" y2="248" stroke="#FF2D95" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="237" x2="280" y2="248" stroke="#FF2D95" stroke-width="0.7" opacity="0.4"/>
    <!-- Railing bar -->
    <line x1="220" y1="244" x2="280" y2="244" stroke="#FF2D95" stroke-width="0.5" opacity="0.35"/>
    <!-- Steps down from deck -->
    <rect x="240" y="259" width="28" height="5" fill="none" stroke="#BD00FF" stroke-width="0.8" opacity="0.5"/>
    <rect x="243" y="264" width="28" height="5" fill="none" stroke="#BD00FF" stroke-width="0.7" opacity="0.4"/>
    <rect x="246" y="269" width="28" height="5" fill="none" stroke="#BD00FF" stroke-width="0.6" opacity="0.3"/>

    <!-- Chimney -->
    <rect x="300" y="88" width="12" height="15" fill="none" stroke="#FF2D95" stroke-width="1"/>
    <!-- Smoke -->
    <circle cx="306" cy="85" r="3" fill="none" stroke="#555" stroke-width="0.8" opacity="0">
      <animate attributeName="cy" from="82" to="45" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0.2;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" from="2" to="8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="308" cy="80" r="2.5" fill="none" stroke="#555" stroke-width="0.8" opacity="0">
      <animate attributeName="cy" from="80" to="40" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.35;0.15;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" from="2" to="7" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- ====== SPEC PANEL (right side) ====== -->
  <rect x="450" y="55" width="420" height="240" rx="6" fill="#0b0c1a" stroke="#1f2050" stroke-width="1"/>
  <text x="660" y="82" class="mono" font-size="13" font-weight="bold" fill="url(#tg)" text-anchor="middle" letter-spacing="3">PREMIUM STATIC CARAVAN</text>
  <line x1="470" y1="92" x2="850" y2="92" stroke="#1f2050" stroke-width="1"/>

  <g class="mono" font-size="11">
    <text x="475" y="118" fill="#52527a">MODEL</text>
    <text x="660" y="118" fill="#FF2D95">Green Village LD-38</text>
    <text x="475" y="142" fill="#52527a">DIMENSIONS</text>
    <text x="660" y="142" fill="#00D4FF">12.0m x 4.0m x 3.2m</text>
    <text x="475" y="166" fill="#52527a">BEDROOMS</text>
    <text x="660" y="166" fill="#BD00FF">3 + Living Room</text>
    <text x="475" y="190" fill="#52527a">INSULATION</text>
    <text x="660" y="190" fill="#00ff41">R-19 Residential Grade</text>
    <text x="475" y="214" fill="#52527a">HEATING</text>
    <text x="660" y="214" fill="#FF2D95">Central + Underfloor</text>
    <text x="475" y="238" fill="#52527a">CERTIFICATION</text>
    <text x="660" y="238" fill="#00D4FF">CE / NF / EN 1647</text>
    <text x="475" y="262" fill="#52527a">DELIVERY</text>
    <text x="660" y="262" fill="#00ff41">PT / FR / NL / ES</text>
  </g>

  <rect x="720" y="270" width="140" height="22" rx="3" fill="none" stroke="#FF2D95" stroke-width="1.5" class="p"/>
  <text x="790" y="286" class="mono" font-size="12" font-weight="bold" fill="#FF2D95" text-anchor="middle">FROM EUR 24,900</text>

  <!-- Ground line -->
  <line x1="0" y1="278" x2="440" y2="278" stroke="#00ff41" stroke-width="0.8" opacity="0.25"/>

  <!-- Trees -->
  <g filter="url(#gs)">
    <!-- Round tree left -->
    <circle cx="30" cy="210" r="18" fill="none" stroke="#00ff41" stroke-width="1.5" class="p2"/>
    <line x1="30" y1="228" x2="30" y2="278" stroke="#00ff41" stroke-width="1" opacity="0.3"/>
    <!-- Pine tree right of caravan -->
    <line x1="405" y1="230" x2="405" y2="278" stroke="#00ff41" stroke-width="1.2" opacity="0.5"/>
    <polygon points="405,180 392,240 418,240" fill="none" stroke="#00ff41" stroke-width="1" opacity="0.4"/>
    <polygon points="405,195 395,232 415,232" fill="none" stroke="#00ff41" stroke-width="0.8" opacity="0.3"/>
    <!-- Small bush -->
    <circle cx="55" cy="268" r="9" fill="none" stroke="#00ff41" stroke-width="0.8" class="p2" style="animation-delay:-2s" opacity="0.3"/>
  </g>

  <!-- Status bar bottom -->
  <rect x="10" y="310" width="880" height="32" rx="4" fill="#0b0c1a" stroke="#1f2050" stroke-width="1"/>
  <circle cx="30" cy="326" r="4" fill="#00ff41" class="bl"/>
  <text x="42" y="330" class="mono" font-size="9" fill="#00ff41">QUALITY VERIFIED</text>
  <text x="200" y="330" class="mono" font-size="9" fill="#52527a">SMTP_VERIFIED / SCORE >= 40 / GATE_PASS</text>
  <text x="600" y="330" class="mono" font-size="9" fill="#00D4FF">DKIM</text>
  <text x="660" y="330" class="mono" font-size="9" fill="#BD00FF">SPF</text>
  <text x="710" y="330" class="mono" font-size="9" fill="#FF2D95">DMARC</text>
  <text x="810" y="330" class="mono fl" font-size="9" fill="#00ff41">LIVE</text>

  <rect x="0" y="348" width="900" height="2" fill="url(#tg)"/>

  <!-- Floating particles -->
  <circle cx="0" cy="0" r="2" fill="#FF2D95" filter="url(#g)">
    <animate attributeName="cx" values="50;400;800;50" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;300;100;50" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.5;0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="2.5" fill="#00D4FF" filter="url(#g)">
    <animate attributeName="cx" values="800;500;100;800" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;50;250;300" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.4;0" dur="15s" repeatCount="indefinite"/>
  </circle>
</svg>
