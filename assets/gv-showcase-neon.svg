<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350">
  <style>
    @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes pulse2 { 0%,100% { opacity: 0.3; } 50% { opacity: 0.85; } }
    @keyframes blink { 0%,49%,100% { opacity: 1; } 50%,99% { opacity: 0.15; } }
    @keyframes dash { to { stroke-dashoffset: -60; } }
    @keyframes flicker { 0%,100% { opacity: 0.8; } 30% { opacity: 1; } 50% { opacity: 0.25; } 52% { opacity: 1; } }
    .p { animation: pulse 3s ease-in-out infinite; }
    .p2 { animation: pulse2 4s ease-in-out infinite; }
    .bl { animation: blink 1.4s infinite; }
    .fl { animation: flicker 2.5s infinite; }
    .dsh { animation: dash 3s linear infinite; }
    .mono { font-family: 'Courier New', monospace; }
  </style>
  <defs>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D95"/>
      <stop offset="50%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <rect width="900" height="350" fill="#06060e"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#tg)"/>

  <!-- ====== LUXURY MOBILE HOME (wireframe, large, centered-left) ====== -->
  <g filter="url(#g)">
    <rect x="80" y="130" width="280" height="100" rx="3" fill="none" stroke="#FF2D95" stroke-width="2.5"/>
    <polygon points="75,130 220,75 365,130" fill="none" stroke="#FF2D95" stroke-width="2"/>
    <rect x="195" y="180" width="28" height="50" rx="2" fill="none" stroke="#BD00FF" stroke-width="1.5" class="p"/>
    <circle cx="218" cy="208" r="2" fill="#BD00FF" class="bl"/>
    <rect x="98" y="150" width="30" height="22" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2" class="p" style="animation-delay:-0.5s"/>
    <rect x="138" y="150" width="30" height="22" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2" class="p" style="animation-delay:-1s"/>
    <rect x="248" y="150" width="30" height="22" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2" class="p" style="animation-delay:-1.5s"/>
    <rect x="295" y="150" width="30" height="22" rx="1" fill="none" stroke="#00D4FF" stroke-width="1.2" class="p" style="animation-delay:-2s"/>
    <line x1="113" y1="150" x2="113" y2="172" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="98" y1="161" x2="128" y2="161" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="153" y1="150" x2="153" y2="172" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="138" y1="161" x2="168" y2="161" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="263" y1="150" x2="263" y2="172" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="248" y1="161" x2="278" y2="161" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="310" y1="150" x2="310" y2="172" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <line x1="295" y1="161" x2="325" y2="161" stroke="#00D4FF" stroke-width="0.6" opacity="0.5"/>
    <rect x="260" y="78" width="18" height="40" fill="none" stroke="#FF2D95" stroke-width="1.2"/>
    <!-- Smoke -->
    <circle cx="269" cy="78" r="3" fill="none" stroke="#555" stroke-width="0.8" opacity="0">
      <animate attributeName="cy" from="75" to="40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0.2;0" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="r" from="2" to="8" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="271" cy="73" r="2.5" fill="none" stroke="#555" stroke-width="0.8" opacity="0">
      <animate attributeName="cy" from="73" to="35" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="opacity" values="0;0.35;0.15;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" from="2" to="7" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <rect x="75" y="230" width="295" height="25" rx="2" fill="none" stroke="#FF2D95" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
    <line x1="115" y1="230" x2="115" y2="255" stroke="#FF2D95" stroke-width="0.5" opacity="0.3"/>
    <line x1="155" y1="230" x2="155" y2="255" stroke="#FF2D95" stroke-width="0.5" opacity="0.3"/>
    <line x1="195" y1="230" x2="195" y2="255" stroke="#FF2D95" stroke-width="0.5" opacity="0.3"/>
    <line x1="235" y1="230" x2="235" y2="255" stroke="#FF2D95" stroke-width="0.5" opacity="0.3"/>
    <line x1="275" y1="230" x2="275" y2="255" stroke="#FF2D95" stroke-width="0.5" opacity="0.3"/>
    <line x1="315" y1="230" x2="315" y2="255" stroke="#FF2D95" stroke-width="0.5" opacity="0.3"/>
    <line x1="195" y1="255" x2="224" y2="255" stroke="#BD00FF" stroke-width="1.2"/>
    <line x1="192" y1="265" x2="227" y2="265" stroke="#BD00FF" stroke-width="1.2"/>
    <line x1="189" y1="275" x2="230" y2="275" stroke="#BD00FF" stroke-width="1.2"/>
    <circle cx="120" cy="240" r="8" fill="none" stroke="#FF2D95" stroke-width="1.2" opacity="0.5"/>
    <circle cx="120" cy="240" r="2" fill="#FF2D95" opacity="0.3"/>
    <circle cx="320" cy="240" r="8" fill="none" stroke="#FF2D95" stroke-width="1.2" opacity="0.5"/>
    <circle cx="320" cy="240" r="2" fill="#FF2D95" opacity="0.3"/>
  </g>

  <!-- ====== SPEC PANEL (right side) ====== -->
  <rect x="450" y="55" width="420" height="240" rx="6" fill="#0b0c1a" stroke="#1f2050" stroke-width="1"/>
  <text x="660" y="82" class="mono" font-size="13" font-weight="bold" fill="url(#tg)" text-anchor="middle" letter-spacing="3">PREMIUM STATIC CARAVAN</text>
  <line x1="470" y1="92" x2="850" y2="92" stroke="#1f2050" stroke-width="1"/>

  <g class="mono" font-size="11">
    <text x="475" y="118" fill="#52527a">MODEL</text>
    <text x="660" y="118" fill="#FF2D95">Green Village LD-38</text>
    <text x="475" y="142" fill="#52527a">DIMENSIONS</text>
    <text x="660" y="142" fill="#00D4FF">12.0m x 4.0m x 3.2m</text>
    <text x="475" y="166" fill="#52527a">BEDROOMS</text>
    <text x="660" y="166" fill="#BD00FF">3 + Living Room</text>
    <text x="475" y="190" fill="#52527a">INSULATION</text>
    <text x="660" y="190" fill="#00ff41">R-19 Residential Grade</text>
    <text x="475" y="214" fill="#52527a">HEATING</text>
    <text x="660" y="214" fill="#FF2D95">Central + Underfloor</text>
    <text x="475" y="238" fill="#52527a">CERTIFICATION</text>
    <text x="660" y="238" fill="#00D4FF">CE / NF / EN 1647</text>
    <text x="475" y="262" fill="#52527a">DELIVERY</text>
    <text x="660" y="262" fill="#00ff41">PT / FR / NL / ES</text>
  </g>

  <rect x="720" y="270" width="140" height="22" rx="3" fill="none" stroke="#FF2D95" stroke-width="1.5" class="p"/>
  <text x="790" y="286" class="mono" font-size="12" font-weight="bold" fill="#FF2D95" text-anchor="middle">FROM EUR 24,900</text>

  <line x1="0" y1="300" x2="440" y2="300" stroke="#1a1a3a" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- Trees -->
  <g filter="url(#gs)">
    <circle cx="30" cy="200" r="16" fill="none" stroke="#00ff41" stroke-width="1.5" class="p2"/>
    <line x1="30" y1="216" x2="30" y2="260" stroke="#00ff41" stroke-width="1" opacity="0.3"/>
    <circle cx="405" cy="160" r="14" fill="none" stroke="#00ff41" stroke-width="1.3" class="p2" style="animation-delay:-1s"/>
    <line x1="405" y1="174" x2="405" y2="210" stroke="#00ff41" stroke-width="1" opacity="0.3"/>
    <circle cx="420" cy="220" r="10" fill="none" stroke="#00ff41" stroke-width="1" class="p2" style="animation-delay:-2s"/>
  </g>

  <!-- Status bar bottom -->
  <rect x="10" y="310" width="880" height="32" rx="4" fill="#0b0c1a" stroke="#1f2050" stroke-width="1"/>
  <circle cx="30" cy="326" r="4" fill="#00ff41" class="bl"/>
  <text x="42" y="330" class="mono" font-size="9" fill="#00ff41">QUALITY VERIFIED</text>
  <text x="200" y="330" class="mono" font-size="9" fill="#52527a">SMTP_VERIFIED / SCORE >= 40 / GATE_PASS</text>
  <text x="600" y="330" class="mono" font-size="9" fill="#00D4FF">DKIM</text>
  <text x="660" y="330" class="mono" font-size="9" fill="#BD00FF">SPF</text>
  <text x="710" y="330" class="mono" font-size="9" fill="#FF2D95">DMARC</text>
  <text x="810" y="330" class="mono" font-size="9" fill="#00ff41" class="fl">LIVE</text>

  <rect x="0" y="348" width="900" height="2" fill="url(#tg)"/>

  <!-- Floating particles -->
  <circle cx="0" cy="0" r="2" fill="#FF2D95" filter="url(#g)">
    <animate attributeName="cx" values="50;400;800;50" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;300;100;50" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0.5;0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="2.5" fill="#00D4FF" filter="url(#g)">
    <animate attributeName="cx" values="800;500;100;800" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="300;50;250;300" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.4;0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="2" fill="#BD00FF" filter="url(#g)">
    <animate attributeName="cx" values="450;200;700;450" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;280;80;150" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0.3;0" dur="10s" repeatCount="indefinite"/>
  </circle>
</svg>
